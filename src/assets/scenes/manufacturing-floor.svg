<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <!-- Background wall -->
  <rect width="400" height="200" fill="#fafaf9"/>
  <!-- Ceiling structure -->
  <rect y="0" width="400" height="18" fill="#d6d3d1"/>
  <line x1="0" y1="18" x2="400" y2="18" stroke="#a8a29e" stroke-width="2"/>
  <!-- Ceiling beams -->
  <rect x="60" y="0" width="8" height="155" fill="#a8a29e" opacity="0.4"/>
  <rect x="160" y="0" width="8" height="155" fill="#a8a29e" opacity="0.4"/>
  <rect x="260" y="0" width="8" height="155" fill="#a8a29e" opacity="0.4"/>
  <rect x="360" y="0" width="8" height="155" fill="#a8a29e" opacity="0.4"/>
  <!-- Floor -->
  <rect y="155" width="400" height="45" fill="#e7e5e4"/>
  <rect y="153" width="400" height="4" fill="#a8a29e"/>
  <!-- Floor markings -->
  <line x1="0" y1="170" x2="400" y2="170" stroke="#fbbf24" stroke-width="2" stroke-dasharray="20,10"/>
  <!-- Large machine left -->
  <rect x="15" y="60" width="65" height="95" rx="4" fill="#44403c"/>
  <rect x="20" y="65" width="55" height="40" rx="2" fill="#1c1917"/>
  <rect x="23" y="68" width="49" height="32" rx="1" fill="#0c4a6e"/>
  <!-- Machine screen data -->
  <line x1="26" y1="74" x2="69" y2="74" stroke="#38bdf8" stroke-width="1"/>
  <line x1="26" y1="79" x2="60" y2="79" stroke="#34d399" stroke-width="1"/>
  <line x1="26" y1="84" x2="65" y2="84" stroke="#38bdf8" stroke-width="1"/>
  <line x1="26" y1="89" x2="55" y2="89" stroke="#f87171" stroke-width="1"/>
  <!-- Machine controls -->
  <circle cx="30" cy="118" r="6" fill="#16a34a"/>
  <circle cx="48" cy="118" r="6" fill="#ca8a04"/>
  <circle cx="66" cy="118" r="6" fill="#dc2626"/>
  <rect x="22" y="130" width="52" height="8" rx="2" fill="#292524"/>
  <!-- Machine arm/output -->
  <rect x="80" y="100" width="30" height="8" rx="2" fill="#78716c"/>
  <!-- Conveyor belt -->
  <rect x="100" y="120" width="180" height="20" rx="4" fill="#57534e"/>
  <rect x="100" y="123" width="180" height="14" fill="#44403c"/>
  <!-- Belt lines -->
  <line x1="115" y1="120" x2="115" y2="140" stroke="#78716c" stroke-width="1.5"/>
  <line x1="135" y1="120" x2="135" y2="140" stroke="#78716c" stroke-width="1.5"/>
  <line x1="155" y1="120" x2="155" y2="140" stroke="#78716c" stroke-width="1.5"/>
  <line x1="175" y1="120" x2="175" y2="140" stroke="#78716c" stroke-width="1.5"/>
  <line x1="195" y1="120" x2="195" y2="140" stroke="#78716c" stroke-width="1.5"/>
  <line x1="215" y1="120" x2="215" y2="140" stroke="#78716c" stroke-width="1.5"/>
  <line x1="235" y1="120" x2="235" y2="140" stroke="#78716c" stroke-width="1.5"/>
  <line x1="255" y1="120" x2="255" y2="140" stroke="#78716c" stroke-width="1.5"/>
  <line x1="275" y1="120" x2="275" y2="140" stroke="#78716c" stroke-width="1.5"/>
  <!-- Boxes on conveyor -->
  <rect x="108" y="107" width="22" height="14" rx="2" fill="#f59e0b"/>
  <line x1="119" y1="107" x2="119" y2="121" stroke="#d97706" stroke-width="1"/>
  <line x1="108" y1="114" x2="130" y2="114" stroke="#d97706" stroke-width="1"/>
  <rect x="148" y="107" width="22" height="14" rx="2" fill="#f59e0b"/>
  <line x1="159" y1="107" x2="159" y2="121" stroke="#d97706" stroke-width="1"/>
  <line x1="148" y1="114" x2="170" y2="114" stroke="#d97706" stroke-width="1"/>
  <rect x="190" y="107" width="22" height="14" rx="2" fill="#f59e0b"/>
  <!-- Pallet stack right -->
  <rect x="300" y="105" width="50" height="8" rx="1" fill="#a16207"/>
  <rect x="303" y="88" width="44" height="18" rx="2" fill="#ca8a04"/>
  <rect x="303" y="70" width="44" height="18" rx="2" fill="#eab308"/>
  <rect x="303" y="52" width="44" height="18" rx="2" fill="#ca8a04"/>
  <!-- Forklift silhouette -->
  <rect x="330" y="113" width="55" height="30" rx="3" fill="#374151"/>
  <rect x="350" y="95" width="8" height="22" fill="#4b5563"/>
  <rect x="342" y="100" width="24" height="4" fill="#6b7280"/>
  <circle cx="340" cy="143" r="8" fill="#1f2937"/>
  <circle cx="340" cy="143" r="4" fill="#374151"/>
  <circle cx="375" cy="143" r="8" fill="#1f2937"/>
  <circle cx="375" cy="143" r="4" fill="#374151"/>
  <!-- Safety sign -->
  <rect x="200" y="28" width="80" height="28" rx="4" fill="#fbbf24"/>
  <text x="240" y="47" text-anchor="middle" fill="#1c1917" font-size="11" font-family="sans-serif" font-weight="bold">⚠ SAFETY FIRST</text>
</svg>
