  <ellipse cx="80" cy="25" rx="12" ry="8" fill="#fef08a" opacity="0.2"/>
  <line x1="200" y1="0" x2="200" y2="22" stroke="#475569" stroke-width="1"/>
  <ellipse cx="200" cy="25" rx="8" ry="5" fill="#fef08a" opacity="0.9"/>
  <ellipse cx="200" cy="25" rx="12" ry="8" fill="#fef08a" opacity="0.2"/>
  <line x1="320" y1="0" x2="320" y2="22" stroke="#475569" stroke-width="1"/>
  <ellipse cx="320" cy="25" rx="8" ry="5" fill="#fef08a" opacity="0.9"/>
  <ellipse cx="320" cy="25" rx="12" ry="8" fill="#fef08a" opacity="0.2"/>
