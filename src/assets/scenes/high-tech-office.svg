  <text x="101" y="108" text-anchor="middle" fill="#fbbf24" font-size="18" font-family="monospace" font-weight="bold">74</text>
  <rect x="133" y="74" width="57" height="50" rx="2" fill="#0c1a3a"/>
  <text x="161" y="85" text-anchor="middle" fill="#34d399" font-size="6" font-family="monospace">CAC PAYBACK</text>
