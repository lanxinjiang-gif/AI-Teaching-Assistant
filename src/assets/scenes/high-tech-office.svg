  <polyline points="18,62 28,55 38,58 48,48 58,52 68,42 78,46 88,38 98,44" stroke="#34d399" stroke-width="1.5" fill="none"/>
  <rect x="105" y="20" width="85" height="50" rx="2" fill="#0c1a3a"/>
  <text x="147" y="32" text-anchor="middle" fill="#a78bfa" font-size="7" font-family="monospace">ARR GROWTH</text>
