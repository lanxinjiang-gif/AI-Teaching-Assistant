  <line x1="294" y1="79" x2="319" y2="79" stroke="#fbbf24" stroke-width="1"/>
  <line x1="294" y1="83" x2="312" y2="83" stroke="#fbbf24" stroke-width="1" opacity="0.6"/>
  <!-- Keyboard glow -->
