  <rect x="300" y="105" width="80" height="45" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="305" y="76" width="70" height="24" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="307" y="78" width="66" height="18" rx="1" fill="#0c1a3a"/>
