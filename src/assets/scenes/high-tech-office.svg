  <rect x="123" y="32" width="12" height="34" rx="1" fill="#7c3aed" opacity="0.8"/>
  <rect x="138" y="26" width="12" height="40" rx="1" fill="#8b5cf6"/>
  <rect x="153" y="30" width="12" height="36" rx="1" fill="#7c3aed" opacity="0.9"/>
  <rect x="168" y="22" width="12" height="44" rx="1" fill="#8b5cf6"/>
