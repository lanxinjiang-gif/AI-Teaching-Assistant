<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Benford Audit Lab</title>
    <style>
:root {
  color-scheme: light;
  --page: #f7f4ea;
  --ink: #1d2430;
  --muted: #5e6875;
  --panel: #fffdf6;
  --line: #d4c9ad;
  --green: #2f7d6b;
  --gold: #d49b24;
  --red: #b95648;
  --blue: #315d86;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background:
    linear-gradient(180deg, rgba(255, 253, 246, 0.82), rgba(247, 244, 234, 0.96)),
    var(--page);
  color: var(--ink);
  font-family:
    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    sans-serif;
}

.game-shell {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 18px;
}

.repo-return {
  position: fixed;
  top: 18px;
  right: 18px;
  z-index: 10;
  display: inline-flex;
  align-items: center;
  min-height: 42px;
  padding: 10px 13px;
  border: 1px solid rgba(29, 36, 48, 0.18);
  border-radius: 8px;
  background: rgba(255, 253, 246, 0.92);
  color: var(--ink);
  font-weight: 800;
  text-decoration: none;
  box-shadow: 0 16px 34px rgba(45, 53, 65, 0.16);
  backdrop-filter: blur(12px);
}

.repo-return:hover,
.repo-return:focus-visible {
  background: var(--green);
  color: #fff;
}

canvas {
  display: block;
  width: min(100%, 1200px);
  max-height: calc(100vh - 36px);
  aspect-ratio: 1200 / 760;
  border: 1px solid rgba(29, 36, 48, 0.18);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: 0 22px 48px rgba(45, 53, 65, 0.18);
  outline: none;
}

canvas:focus-visible {
  box-shadow:
    0 0 0 3px rgba(47, 125, 107, 0.28),
    0 22px 48px rgba(45, 53, 65, 0.18);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

</style>
  </head>

    state.sampleCounts = Array(9).fill(0);
    state.sampleAmounts = [];
    state.mechanismQuiz = false;
    state.mechanismIndex = 0;
    state.mechanismAnswered = false;
    state.mechanismChoice = -1;
    state.mechanismScore = 0;
    state.lastFeedback = "";
    announce("Part 1: mechanism lab");
  }

  function resetAudit() {
    state.mode = "audit";
    state.auditIndex = 0;
    state.auditAnswered = false;
    state.auditChoice = "";
    state.auditScore = 0;
    state.lastFeedback = "";
    announce("Part 2: audit triage");
  }

  function resetAll() {
    state.mode = "menu";
    state.lastFeedback = "";
    state.focusMessage = "Menu";
    announce("Benford Audit Lab menu");
  }

  function random() {
    state.seed = (state.seed * 1664525 + 1013904223) >>> 0;
    return state.seed / 4294967296;
  }

  function addNaturalSamples(count) {
    for (let i = 0; i < count; i += 1) {
      const amount = Math.pow(10, 1 + random() * 5);
      const digit = firstDigit(amount);
      state.sampleCounts[digit - 1] += 1;
      state.sampleTotal += 1;
      state.sampleAmounts.unshift(formatMoney(amount));
    }
    state.lastFeedback =
      state.sampleTotal < 100
        ? "Noisy invoice sample: generate another batch."
        : "The sample is settling toward the nonuniform Benford pattern.";
    announce(state.lastFeedback);
  }

  function firstDigit(value) {
    let n = Math.abs(value);
    while (n >= 10) n /= 10;
    while (n > 0 && n < 1) n *= 10;
    return Math.max(1, Math.min(9, Math.floor(n)));
  }

  function formatMoney(value) {
    return "$" + value.toLocaleString("en-US", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2,
    });
  }

  function startMechanismQuiz() {
    state.mechanismQuiz = true;
    state.mechanismIndex = 0;
    state.mechanismAnswered = false;
    state.mechanismChoice = -1;
    state.lastFeedback = "";
    announce("Mechanism checkpoint started");
  }

  function chooseMechanism(index) {
    if (state.mechanismAnswered) return;
    const q = mechanismQuestions[state.mechanismIndex];
    state.mechanismAnswered = true;
    state.mechanismChoice = index;
    if (index === q.correct) {
      state.mechanismScore += 25;
      state.lastFeedback = "Correct. " + q.explain;
    } else {
      state.lastFeedback = "Not quite. " + q.explain;
    }
    announce(state.lastFeedback);
  }

  function nextMechanismQuestion() {
    if (!state.mechanismAnswered) return;
    if (state.mechanismIndex < mechanismQuestions.length - 1) {
      state.mechanismIndex += 1;
      state.mechanismAnswered = false;
      state.mechanismChoice = -1;
      state.lastFeedback = "";
      announce("Next mechanism question");
    } else {
      state.mode = "mechanism_done";
      announce("Part 1 complete");
    }
  }

  function chooseAudit(code) {
    if (state.auditAnswered) return;
    const item = auditCases[state.auditIndex];
    state.auditAnswered = true;
    state.auditChoice = code;
    if (code === item.answer) {
      state.auditScore += 20;
      state.lastFeedback = "Good audit call. " + item.explain;
    } else {
      state.lastFeedback = "Revise the audit call. " + item.explain;
    }
    announce(state.lastFeedback);
  }

  function nextAuditCase() {
    if (!state.auditAnswered) return;
    if (state.auditIndex < auditCases.length - 1) {
      state.auditIndex += 1;
      state.auditAnswered = false;
      state.auditChoice = "";
      state.lastFeedback = "";
      announce("Next audit case");
    } else {
      state.mode = "audit_done";
      announce("Part 2 complete");
    }
  }

  function resizeCanvas() {
    const ratio = Math.min(
      (window.innerWidth - 36) / WIDTH,
      (window.innerHeight - 36) / HEIGHT,
      1
    );
    canvas.style.width = Math.max(320, WIDTH * ratio) + "px";
    canvas.style.height = Math.max(203, HEIGHT * ratio) + "px";
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(WIDTH * dpr);
    canvas.height = Math.round(HEIGHT * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    render();
  }

  function mapPointer(event) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: ((event.clientX - rect.left) / rect.width) * WIDTH,
      y: ((event.clientY - rect.top) / rect.height) * HEIGHT,
    };
  }

  function handleClick(event) {
    canvas.focus();
    const pt = mapPointer(event);
    const hit = state.buttons.find(
      (b) =>
        !b.disabled &&
        pt.x >= b.x &&
        pt.x <= b.x + b.w &&
        pt.y >= b.y &&
        pt.y <= b.y + b.h
    );
    if (hit) {
      hit.action();
      render();
    }
  }

  function handleKey(event) {
    const key = event.key.toLowerCase();
    if (key === "f") {
      event.preventDefault();
      toggleFullscreen();
      return;
    }
    if (key === "escape") {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        resetAll();
        render();
      }
      return;
    }
    if (state.mode === "menu") {
      if (key === "1") resetMechanism();
      if (key === "2") resetAudit();
      render();
      return;
    }
    if (state.mode === "mechanism") {
      if (!state.mechanismQuiz && (key === " " || key === "enter")) {
        addNaturalSamples(25);
      } else if (!state.mechanismQuiz && key === "q") {
        startMechanismQuiz();
      } else if (state.mechanismQuiz && ["1", "2", "3"].includes(key)) {
        chooseMechanism(Number(key) - 1);
      } else if (state.mechanismQuiz && (key === " " || key === "enter")) {
        nextMechanismQuestion();
      }
      render();
      return;
    }
    if (state.mode === "mechanism_done") {
      if (key === "2") resetAudit();
      if (key === "enter" || key === " ") resetAudit();
      render();
      return;
    }
    if (state.mode === "audit") {
      if (key === "1") chooseAudit("accept");
      if (key === "2") chooseAudit("investigate");
      if (key === "3") chooseAudit("not_suitable");
      if (key === " " || key === "enter") nextAuditCase();
      render();
      return;
    }
    if (state.mode === "audit_done") {
      if (key === "1" || key === "enter" || key === " ") resetMechanism();
      render();
    }
  }

  function toggleFullscreen() {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else if (canvas.requestFullscreen) {
      canvas.requestFullscreen();
    }
  }

  function announce(text) {
    state.focusMessage = text;
    if (liveStatus) liveStatus.textContent = text;
  }

  function update(dt) {
    state.tick += dt;
  }

  function render() {
    state.buttons = [];
    clear();
    drawBackground();
    drawHeader();
    if (state.mode === "menu") drawMenu();
    if (state.mode === "mechanism") drawMechanism();
    if (state.mode === "mechanism_done") drawMechanismDone();
    if (state.mode === "audit") drawAudit();
    if (state.mode === "audit_done") drawAuditDone();
    drawFooter();
  }

    ctx.clearRect(0, 0, WIDTH, HEIGHT);
  }

  function drawBackground() {

      ctx.lineTo(x + 120, HEIGHT);
      ctx.lineTo(x + 80, HEIGHT - 64);

  function drawMechanism() {

  function drawGrowthScale(x, y, w, h) {
    ctx.fillStyle = colors.blueSoft;
    roundRect(x, y, w, h, 8, true, false);
    ctx.strokeStyle = "#abc5dc";
    roundRect(x, y, w, h, 8, false, true);

    ctx.fillStyle = colors.ink;
    ctx.font = "700 17px Inter, sans-serif";
    ctx.fillText("Why 1 lasts longer than 9", x + 22, y + 32);
    ctx.font = "500 14px Inter, sans-serif";
    ctx.fillStyle = colors.muted;
    ctx.fillText("A multiplying scale spends unequal space in each leading digit.", x + 22, y + 56);

    const barX = x + 28;
    const barY = y + 76;
    const barW = w - 56;
    ctx.fillStyle = "#ffffff";
    roundRect(barX, barY, barW, 12, 6, true, false);
    for (let d = 1; d <= 9; d += 1) {
      const left = barX + Math.log10(d) * barW;
      const right = barX + Math.log10(d + 1) * barW;
      ctx.fillStyle = d === 1 ? colors.green : d === 9 ? colors.red : colors.gold;
      ctx.globalAlpha = d === 1 || d === 9 ? 0.95 : 0.58;
      ctx.fillRect(left, barY, Math.max(1, right - left), 12);
      ctx.globalAlpha = 1;
      ctx.fillStyle = colors.ink;
      ctx.font = "700 12px Inter, sans-serif";
      ctx.fillText(String(d), left + 2, barY + 30);
    }

    ctx.strokeStyle = colors.ink;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(barX, barY - 5);
    ctx.lineTo(barX, barY + 19);
    ctx.moveTo(barX + barW, barY - 5);
    ctx.lineTo(barX + barW, barY + 19);
    ctx.stroke();
  }

  function drawDiameterVideo(x, y, w, h, options = {}) {
    const compact = Boolean(options.compact);
    const title = options.title || (compact ? "Diameter growth video" : "Short video: diameter growth changes the first digit");
    ctx.fillStyle = "#ffffff";
    roundRect(x, y, w, h, 8, true, false);
    ctx.strokeStyle = colors.line;
    roundRect(x, y, w, h, 8, false, true);

    const cycle = 7.2;
    const oneBandShare = 0.7;
    const phase = (state.tick % cycle) / cycle;
    const firstScene = phase < oneBandShare;
    const local = firstScene
      ? phase / oneBandShare
      : (phase - oneBandShare) / (1 - oneBandShare);
    const eased = easeInOut(local);
    const startValue = firstScene ? 1.14 : 9.2;
    const endValue = firstScene ? 2.28 : 10.0;
    const value = startValue + (endValue - startValue) * eased;
    const leading = firstDigit(value);
    const before = firstScene ? "1.14" : "9.20";
    const after = firstScene ? "2.28" : "10.00";

    ctx.fillStyle = colors.ink;
    ctx.font = compact ? "700 13px Inter, sans-serif" : "800 16px Inter, sans-serif";
    ctx.fillText(title, x + 16, y + 24);

    ctx.fillStyle = colors.muted;
    ctx.font = compact ? "500 11px Inter, sans-serif" : "500 13px Inter, sans-serif";
    ctx.fillText(
      firstScene ? "Digit 1 covers a long growth stretch" : "Digit 9 rolls over quickly",
      x + 16,
      y + (compact ? 42 : 46)
    );

    const groundY = y + h - (compact ? 30 : 34);
    const trunkX = x + (compact ? 54 : 72);
    drawTinyTree(trunkX, groundY, compact ? 0.68 : 0.82);

    const diskX = x + w - (compact ? 82 : 116);
    const diskY = y + (compact ? 78 : 84);
    const minR = compact ? 25 : 34;
    const maxR = compact ? 36 : 48;
    const radius = minR + (maxR - minR) * eased;
    drawGrowthDisk(diskX, diskY, radius, leading, value, compact, y + h - (compact ? 6 : 8));

    ctx.strokeStyle = colors.plum;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(trunkX + (compact ? 35 : 44), groundY - (compact ? 45 : 56));
    ctx.bezierCurveTo(
      x + w * 0.42,
      y + h * 0.35,
      diskX - radius - 28,
      diskY - 20,
      diskX - radius - 4,
      diskY
    );
    ctx.stroke();
    drawArrowHead(diskX - radius - 4, diskY, 0, colors.plum);

    const boxX = x + (compact ? 12 : 18);
    const boxY = y + h - (compact ? 23 : 26);
    const boxW = w - (compact ? 24 : 36);
    ctx.fillStyle = firstScene ? colors.greenSoft : colors.redSoft;
    roundRect(boxX, boxY - (compact ? 18 : 22), boxW, compact ? 22 : 26, 7, true, false);
    ctx.fillStyle = colors.ink;
    ctx.font = compact ? "700 10px Inter, sans-serif" : "700 12px Inter, sans-serif";
    ctx.fillText(
      firstScene
        ? `1.x must nearly double before it becomes 2.x`
        : `9.x needs only about 11% growth to become 1x`,
      boxX + 9,
      boxY - (compact ? 3 : 5)
    );

    const barX = x + (compact ? 150 : 178);
    const barY = y + (compact ? 50 : 58);
    const barW = compact ? 92 : 132;
    drawVideoProgress(barX, barY, barW, firstScene, local, compact);
  }

  function easeInOut(t) {
    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  }

  function drawTinyTree(x, groundY, scale) {
    ctx.fillStyle = "#9dc740";
    ctx.beginPath();
    ctx.ellipse(x, groundY, 54 * scale, 10 * scale, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#9b6938";
    ctx.lineWidth = 9 * scale;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x, groundY - 4 * scale);
    ctx.lineTo(x - 4 * scale, groundY - 74 * scale);
    ctx.stroke();
    ctx.lineWidth = 4 * scale;
    for (let i = -2; i <= 2; i += 1) {
      ctx.beginPath();
      ctx.moveTo(x - 4 * scale, groundY - 50 * scale);
      ctx.lineTo(x + i * 17 * scale, groundY - (78 + Math.abs(i) * 8) * scale);
      ctx.stroke();
    }

    ctx.fillStyle = "#b6d822";
    for (let i = 0; i < 18; i += 1) {
      const angle = i * 2.14;
      const lx = x + Math.cos(angle) * (18 + (i % 5) * 8) * scale;
      const ly = groundY - (70 + Math.sin(angle) * 20 + (i % 4) * 7) * scale;
      ctx.beginPath();
      ctx.ellipse(lx, ly, 5 * scale, 8 * scale, angle, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.lineCap = "butt";
  }

  function drawGrowthDisk(x, y, radius, leading, value, compact, valueLabelY) {
    ctx.fillStyle = "#d49a62";
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#6f4528";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.strokeStyle = colors.blue;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - radius + 7, y);
    ctx.lineTo(x + radius - 7, y);
    ctx.stroke();
    drawArrowHead(x + radius - 7, y, 0, colors.blue);
    drawArrowHead(x - radius + 7, y, Math.PI, colors.blue);

    ctx.fillStyle = colors.ink;
    ctx.font = compact ? "700 10px Inter, sans-serif" : "700 12px Inter, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("DIAMETER", x, y - 6);
    ctx.font = compact ? "800 20px Inter, sans-serif" : "800 26px Inter, sans-serif";
    ctx.fillStyle = leading === 1 ? colors.green : colors.red;
    ctx.fillText(String(leading), x, y + (compact ? 25 : 32));
    ctx.fillStyle = colors.muted;
    ctx.font = compact ? "700 10px Inter, sans-serif" : "700 12px Inter, sans-serif";
    ctx.fillText(value.toFixed(2), x, valueLabelY);
    ctx.textAlign = "left";
  }

  function drawArrowHead(x, y, angle, color) {
    ctx.fillStyle = color;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-8, -4);
    ctx.lineTo(-8, 4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawVideoProgress(x, y, w, firstScene, local, compact) {
    ctx.fillStyle = colors.faint;
    roundRect(x, y, w, 10, 5, true, false);
    ctx.fillStyle = firstScene ? colors.green : colors.red;
    roundRect(x, y, w * local, 10, 5, true, false);
    ctx.fillStyle = colors.muted;
    ctx.font = compact ? "700 9px Inter, sans-serif" : "700 11px Inter, sans-serif";
    const labelY = firstScene ? y + (compact ? 44 : 50) : y + (compact ? 25 : 28);
    ctx.fillText(firstScene ? "long 1.x band" : "short 9.x band", x, labelY);
  }

  function drawSampleLedger(x, y, w, h) {
    ctx.fillStyle = "#ffffff";

  function drawGeneratedInvoiceBox(x, y, w, h) {
    ctx.fillStyle = "#ffffff";
    roundRect(x, y, w, h, 8, true, false);
    ctx.strokeStyle = colors.line;
    roundRect(x, y, w, h, 8, false, true);

    ctx.fillStyle = colors.ink;
    ctx.font = "700 15px Inter, sans-serif";
    ctx.fillText("Generated invoice amounts", x + 18, y + 27);

    ctx.fillStyle = colors.muted;
    ctx.font = "600 12px Inter, sans-serif";
    ctx.fillText(
      state.sampleTotal > 0 ? `${state.sampleTotal} generated so far` : "Generate a batch to start the list",
      x + w - 164,
      y + 27
    );

    if (state.sampleAmounts.length === 0) {
      ctx.fillStyle = colors.muted;
      ctx.font = "500 14px Inter, sans-serif";
      drawWrappedText(
        "Press Generate 25 Invoices to fill this work area with the invoice amounts used in the Benford sample.",
        x + 18,
        y + 68,
        w - 36,
        22
      );
      return;
    }

    const values = state.sampleAmounts;
    const innerX = x + 18;
    const innerY = y + 54;
    const innerW = w - 36;
    const innerH = h - 74;
    const rowHeight = values.length > 140 ? 13 : values.length > 90 ? 14 : 15;
    const fontSize = rowHeight - 4;
    const rows = Math.max(1, Math.floor(innerH / rowHeight));
    const cols = Math.max(1, Math.ceil(values.length / rows));
    const colW = innerW / cols;

    ctx.fillStyle = colors.ink;
    ctx.font = `600 ${fontSize}px Inter, sans-serif`;
    values.forEach((value, index) => {
      const col = Math.floor(index / rows);
      const row = index % rows;
      const tx = innerX + col * colW;
      const ty = innerY + row * rowHeight;
      ctx.fillText(value, tx, ty);
    });
  }

  function sampleFractions() {
    if (state.sampleTotal === 0) return Array(9).fill(0);
    return state.sampleCounts.map((n) => n / state.sampleTotal);
  }

  function drawMechanismQuiz() {
    const q = mechanismQuestions[state.mechanismIndex];
    drawPanel(48, 120, 1104, 560, "Part 1 checkpoint");
    ctx.fillStyle = colors.ink;
    ctx.font = "800 22px Inter, sans-serif";
    ctx.fillText(`Question ${state.mechanismIndex + 1} of ${mechanismQuestions.length}`, 86, 172);
    ctx.fillStyle = colors.faint;
    roundRect(86, 194, 650, 96, 8, true, false);
    ctx.strokeStyle = colors.line;
    roundRect(86, 194, 650, 96, 8, false, true);
    ctx.fillStyle = colors.ink;
    ctx.font = "700 18px Inter, sans-serif";
    drawWrappedText(q.prompt, 106, 226, 610, 25, 3);

    drawBenfordBars(794, 184, 280, 224, null, "Benford first-digit target");

    for (let i = 0; i < q.choices.length; i += 1) {
      const y = 330 + i * 74;
      const selected = state.mechanismChoice === i;
      const correct = state.mechanismAnswered && i === q.correct;
      const wrong = state.mechanismAnswered && selected && i !== q.correct;
      const accent = correct ? colors.green : wrong ? colors.red : colors.blue;
      drawChoiceButton(
        86,
        y,
        620,
        54,
        `${i + 1}. ${q.choices[i]}`,
        () => chooseMechanism(i),
        accent,
        state.mechanismAnswered && !selected && !correct
      );
    }

    drawFeedbackBox(766, 452, 314, 120, state.lastFeedback || "Choose the best answer.");
    addButton(766, 602, 170, 44, "Continue", nextMechanismQuestion, {
      accent: colors.green,
      disabled: !state.mechanismAnswered,
    });
    addButton(954, 602, 126, 44, "Back", () => {
      state.mechanismQuiz = false;
      state.lastFeedback = "";
    });

    drawScoreBadge(86, 610, "Mechanism score", `${state.mechanismScore}/100`);
  }

  function drawMechanismDone() {
    drawPanel(128, 130, 944, 520, "Part 1 complete");
    ctx.fillStyle = colors.greenSoft;
    roundRect(178, 184, 272, 224, 8, true, false);
    drawBenfordBars(192, 214, 244, 154, null, "Target curve");
    ctx.fillStyle = colors.ink;
    ctx.font = "800 28px Inter, sans-serif";
    ctx.fillText("You can explain the curve now.", 486, 226);
    ctx.font = "500 17px Inter, sans-serif";
    ctx.fillStyle = colors.muted;
    drawWrappedText(
      "Benford's Law is not about equal chances. It appears when numbers grow and spread across orders of magnitude. Digit 1 has the widest ratio-space; digit 9 has the narrowest.",
      486,
      270,
      500,
      25
    );
    drawScoreBadge(486, 398, "Mechanism score", `${state.mechanismScore}/100`);
    addButton(486, 494, 220, 52, "Start Audit Triage", resetAudit, {
      accent: colors.blue,
    });
    addButton(726, 494, 180, 52, "Try Part 1 Again", resetMechanism);
  }

  function drawAudit() {
    const item = auditCases[state.auditIndex];
    drawPanel(48, 120, 512, 560, `Case ${state.auditIndex + 1} of ${auditCases.length}`);

    ctx.fillStyle = colors.ink;
    ctx.font = "800 25px Inter, sans-serif";
    ctx.fillText(item.title, 82, 174);
    ctx.fillStyle = colors.blue;
    ctx.font = "700 16px Inter, sans-serif";
    drawWrappedText(item.subtitle, 82, 204, 410, 22);
    ctx.fillStyle = colors.muted;
    ctx.font = "500 15px Inter, sans-serif";
    drawWrappedText(item.context, 82, 262, 416, 22);

    drawMiniLedger(82, 334, 416, 116, item.records);
    drawDivergenceMeter(82, 478, 416, caseDivergence(item));

    drawPanel(590, 120, 562, 560, "Digit evidence and decision");
    drawBenfordBars(638, 172, 456, 270, item.observed, "Observed vs Benford");

    const choices = [
      ["accept", "1. Accept as low digit-risk", colors.green],
      ["investigate", "2. Flag for audit follow-up", colors.red],
      ["not_suitable", "3. Benford not appropriate", colors.gold],
    ];
    choices.forEach((choice, index) => {
      const [code, label, accent] = choice;
      drawChoiceButton(
        638,
        468 + index * 55,
        456,
        44,
        label,
        () => chooseAudit(code),
        state.auditChoice === code ? accent : colors.blue,
        state.auditAnswered && state.auditChoice !== code && item.answer !== code
      );
    });

    drawFeedbackBox(
      82,
      566,
      416,
      100,
      state.lastFeedback || "Make the audit call. The chart is evidence, not a verdict."
    );
    addButton(930, 638, 164, 42, "Continue", nextAuditCase, {
      accent: colors.green,
      disabled: !state.auditAnswered,
    });
    drawScoreBadge(638, 638, "Audit score", `${state.auditScore}/100`);
  }

  function drawAuditDone() {
    const completedBoth = state.mechanismScore > 0;
    drawPanel(112, 124, 976, 548, "Audit debrief");
    ctx.fillStyle = colors.ink;
    ctx.font = "800 30px Inter, sans-serif";
    ctx.fillText(
      completedBoth ? "You completed both Benford roles." : "You completed audit triage.",
      164,
      188
    );
    ctx.font = "500 17px Inter, sans-serif";
    ctx.fillStyle = colors.muted;
    drawWrappedText(
      completedBoth
        ? "A college auditor should leave with two habits: first, explain why the leading digits are nonuniform; second, ask whether the data population is appropriate before treating a Benford deviation as a fraud lead."
        : "A college auditor should ask whether the data population is appropriate before treating a Benford deviation as a fraud lead.",
      164,
      232,
      720,
      25
    );

    drawScoreBadge(164, 344, "Mechanism score", `${state.mechanismScore}/100`);
    drawScoreBadge(414, 344, "Audit score", `${state.auditScore}/100`);
    drawScoreBadge(664, 344, "Total mastery", `${state.mechanismScore + state.auditScore}/200`);

    const notes = [
      "Real-life accounting amounts often conform.",
      "Human-created labels, IDs, and capped prices often do not.",
      "Benford screens for unusual patterns; evidence work proves or disproves fraud.",
    ];
    notes.forEach((note, i) => {
      ctx.fillStyle = i === 0 ? colors.greenSoft : i === 1 ? colors.goldSoft : colors.blueSoft;
      roundRect(164, 448 + i * 52, 760, 36, 8, true, false);
      ctx.fillStyle = colors.ink;
      ctx.font = "700 15px Inter, sans-serif";
      ctx.fillText(note, 184, 471 + i * 52);
    });

    addButton(164, 620, 188, 44, "Restart Part 1", resetMechanism, {
      accent: colors.green,
    });
    addButton(374, 620, 188, 44, "Replay Audit", resetAudit, {
      accent: colors.blue,
    });
  }

  function drawMiniLedger(x, y, w, h, records) {
    ctx.fillStyle = "#ffffff";
    roundRect(x, y, w, h, 8, true, false);
    ctx.strokeStyle = colors.line;
    roundRect(x, y, w, h, 8, false, true);
    ctx.fillStyle = colors.ink;
    ctx.font = "700 15px Inter, sans-serif";
    ctx.fillText("Sample records", x + 18, y + 28);
    ctx.font = "600 15px Inter, sans-serif";
    records.forEach((record, index) => {
      const col = index % 2;
      const row = Math.floor(index / 2);
      ctx.fillStyle = index === 0 ? colors.green : colors.ink;
      ctx.fillText(record, x + 18 + col * 188, y + 62 + row * 27);
    });
  }

  function caseDivergence(item) {
    return item.observed.reduce((sum, val, i) => sum + Math.abs(val - benford[i]), 0) / 2;
  }

  function drawDivergenceMeter(x, y, w, divergence) {
    const score = Math.min(1, divergence / 0.28);
    ctx.fillStyle = colors.faint;
    roundRect(x, y, w, 62, 8, true, false);
    ctx.fillStyle = colors.ink;
    ctx.font = "700 15px Inter, sans-serif";
    ctx.fillText("Digit-pattern pressure", x + 18, y + 24);
    ctx.fillStyle = "#ffffff";
    roundRect(x + 18, y + 36, w - 36, 12, 6, true, false);
    ctx.fillStyle = score > 0.62 ? colors.red : score > 0.28 ? colors.gold : colors.green;
    roundRect(x + 18, y + 36, (w - 36) * score, 12, 6, true, false);
  }

  function drawBenfordBars(x, y, w, h, observed, label) {
    ctx.fillStyle = "#ffffff";
    roundRect(x, y, w, h, 8, true, false);
    ctx.strokeStyle = colors.line;
    roundRect(x, y, w, h, 8, false, true);

    ctx.fillStyle = colors.ink;
    ctx.font = "700 16px Inter, sans-serif";
    ctx.fillText(label, x + 18, y + 28);
    ctx.font = "500 12px Inter, sans-serif";
    ctx.fillStyle = colors.muted;
    ctx.fillText("First digit", x + 18, y + h - 16);

    const chartX = x + 40;
    const chartY = y + 50;
    const chartW = w - 72;
    const chartH = h - 94;
    const max = 0.42;
    ctx.strokeStyle = "#e8dfcc";
    ctx.lineWidth = 1;
    for (let t = 0; t <= 3; t += 1) {
      const gy = chartY + chartH - (t / 3) * chartH;
      ctx.beginPath();
      ctx.moveTo(chartX - 8, gy);
      ctx.lineTo(chartX + chartW + 8, gy);
      ctx.stroke();
      ctx.fillStyle = colors.muted;
      ctx.font = "500 11px Inter, sans-serif";
      ctx.fillText(`${Math.round((max * t * 100) / 3)}%`, x + 8, gy + 4);
    }

    const gap = 9;
    const barW = (chartW - gap * 8) / 9;
    for (let i = 0; i < 9; i += 1) {
      const bx = chartX + i * (barW + gap);
      const expectedH = Math.min(chartH, (benford[i] / max) * chartH);
      ctx.fillStyle = colors.greenSoft;
      ctx.fillRect(bx, chartY + chartH - expectedH, barW, expectedH);
      ctx.fillStyle = colors.green;
      ctx.fillRect(bx, chartY + chartH - expectedH, barW, 3);
      if (observed) {
        const observedH = Math.min(chartH, (observed[i] / max) * chartH);
        ctx.fillStyle = colors.red;
        ctx.globalAlpha = 0.82;
        ctx.fillRect(bx + barW * 0.2, chartY + chartH - observedH, barW * 0.6, observedH);
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = colors.ink;
      ctx.font = "700 12px Inter, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(String(i + 1), bx + barW / 2, chartY + chartH + 18);
      ctx.textAlign = "left";
    }

    if (w >= 360) {
      ctx.fillStyle = colors.green;
      ctx.fillRect(x + w - 138, y + 18, 12, 8);
      ctx.fillStyle = colors.muted;
      ctx.font = "500 12px Inter, sans-serif";
      ctx.fillText("Benford", x + w - 120, y + 26);
      if (observed) {
        ctx.fillStyle = colors.red;
        ctx.fillRect(x + w - 138, y + 36, 12, 8);
        ctx.fillStyle = colors.muted;
        ctx.fillText("Observed", x + w - 120, y + 44);
      }
    }
  }

  function drawChoiceButton(x, y, w, h, label, action, accent, muted) {
    ctx.fillStyle = muted ? "#f1eee5" : "#ffffff";
    roundRect(x, y, w, h, 8, true, false);
    ctx.strokeStyle = muted ? "#ddd7c9" : accent;
    ctx.lineWidth = muted ? 1 : 2;
    roundRect(x, y, w, h, 8, false, true);
    ctx.lineWidth = 1;
    ctx.fillStyle = muted ? colors.muted : colors.ink;
    ctx.font = "700 16px Inter, sans-serif";
    drawWrappedText(label, x + 18, y + 23, w - 36, 20, 2);
    addButton(x, y, w, h, label, action, { invisible: true, disabled: muted });
  }

  function drawFeedbackBox(x, y, w, h, text) {
    ctx.fillStyle = colors.faint;
    roundRect(x, y, w, h, 8, true, false);
    ctx.strokeStyle = colors.line;
    roundRect(x, y, w, h, 8, false, true);
    ctx.fillStyle = colors.ink;
    ctx.font = "600 14px Inter, sans-serif";
    drawWrappedText(text, x + 16, y + 24, w - 32, 19);
  }

  function drawScoreBadge(x, y, label, value) {
    ctx.fillStyle = "#ffffff";
    roundRect(x, y, 214, 66, 8, true, false);
    ctx.strokeStyle = colors.line;
    roundRect(x, y, 214, 66, 8, false, true);
    ctx.fillStyle = colors.muted;
    ctx.font = "700 13px Inter, sans-serif";
    ctx.fillText(label.toUpperCase(), x + 18, y + 24);
    ctx.fillStyle = colors.ink;
    ctx.font = "800 24px Inter, sans-serif";
    ctx.fillText(value, x + 18, y + 52);
  }

  function drawPanel(x, y, w, h, title) {
    ctx.fillStyle = "rgba(255, 253, 246, 0.96)";
    roundRect(x, y, w, h, 8, true, false);
    ctx.strokeStyle = colors.line;
    ctx.lineWidth = 1;
    roundRect(x, y, w, h, 8, false, true);
    ctx.fillStyle = colors.muted;
    ctx.font = "800 13px Inter, sans-serif";
    ctx.fillText(title.toUpperCase(), x + 24, y + 32);
  }

  function drawPill(x, y, label, active) {
    ctx.fillStyle = active ? colors.green : colors.faint;
    roundRect(x, y, 156, 30, 15, true, false);
    ctx.fillStyle = active ? "#ffffff" : colors.muted;
    ctx.font = "800 12px Inter, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(label, x + 78, y + 20);
    ctx.textAlign = "left";
  }

  function drawImageFrame(img, x, y, w, h, label) {
    ctx.fillStyle = "#ffffff";
    roundRect(x, y, w, h, 8, true, false);
    ctx.strokeStyle = colors.line;
    roundRect(x, y, w, h, 8, false, true);
    if (img.complete && img.naturalWidth > 0) {
      const scale = Math.min((w - 18) / img.naturalWidth, (h - 34) / img.naturalHeight);
      const iw = img.naturalWidth * scale;
      const ih = img.naturalHeight * scale;
      ctx.drawImage(img, x + (w - iw) / 2, y + 12, iw, ih);
    } else {
      ctx.fillStyle = colors.faint;
      roundRect(x + 12, y + 12, w - 24, h - 34, 6, true, false);
    }
    ctx.fillStyle = colors.muted;
    ctx.font = "600 12px Inter, sans-serif";
    ctx.fillText(label, x + 14, y + h - 10);
  }

  function drawButton(x, y, w, h, label, options = {}) {
    const disabled = Boolean(options.disabled);
    const accent = options.accent || colors.blue;
    ctx.fillStyle = disabled ? "#ded9cc" : accent;
    roundRect(x, y, w, h, 8, true, false);
    ctx.fillStyle = disabled ? colors.muted : "#ffffff";
    ctx.font = `${options.small ? "700 13px" : "800 15px"} Inter, sans-serif`;
    ctx.textAlign = "center";
    ctx.fillText(label, x + w / 2, y + h / 2 + (options.small ? 5 : 6));
    ctx.textAlign = "left";
  }

  function addButton(x, y, w, h, label, action, options = {}) {
    const disabled = Boolean(options.disabled);
    if (!options.invisible) {
      drawButton(x, y, w, h, label, options);
    }
    state.buttons.push({ x, y, w, h, label, action, disabled });
  }

  function drawWrappedText(text, x, y, maxWidth, lineHeight, maxLines = Infinity) {
    const words = String(text).split(/\s+/);
    let line = "";
    let lines = 0;
    for (let i = 0; i < words.length; i += 1) {
      const word = words[i];
      const test = line ? line + " " + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        ctx.fillText(line, x, y);
        y += lineHeight;
        lines += 1;
        line = word;
        if (lines >= maxLines - 1) {
          const rest = words.slice(i + 1).join(" ");
          let clipped = line + (rest ? " " + rest : "");
          while (ctx.measureText(clipped + "...").width > maxWidth && clipped.length > 0) {
            clipped = clipped.slice(0, -1);
          }
          ctx.fillText(clipped + "...", x, y);
          return y + lineHeight;
        }
      } else {
        line = test;
      }
    }
    if (line) {
      ctx.fillText(line, x, y);
      y += lineHeight;
    }
    return y;
  }

  function roundRect(x, y, w, h, r, fill, stroke) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + w - radius, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
    ctx.lineTo(x + w, y + h - radius);
    ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
    ctx.lineTo(x + radius, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
  }

  function renderGameToText() {
    const common = {
      coordinate_system: "Canvas coordinates, origin top-left, x right, y down, 1200x760.",
      mode: state.mode,
      focus: state.focusMessage,
      buttons: state.buttons
        .filter((b) => !b.disabled)
        .map((b) => ({ label: b.label, x: Math.round(b.x), y: Math.round(b.y), w: b.w, h: b.h })),
    };
    const withCommon = (extra) => JSON.stringify(Object.assign({}, common, extra));
    if (state.mode === "mechanism") {
      return withCommon({
        part: state.mechanismQuiz ? "mechanism_quiz" : "mechanism_simulator",
        sample_total: state.sampleTotal,
        sample_counts: state.sampleCounts,
        observed_first_digit_percent: sampleFractions().map((v) => Number((v * 100).toFixed(1))),
        diameter_video: state.mechanismQuiz
          ? "Hidden during checkpoint quiz"
          : "Looping animation: 1.x runs slower across a long growth stretch; 9.x rolls over to 1x quickly after about 11% growth.",
        video_phase_seconds: Number((state.tick % 7.2).toFixed(2)),
        quiz_index: state.mechanismIndex,
        quiz_answered: state.mechanismAnswered,
        score: state.mechanismScore,
        feedback: state.lastFeedback,
      });
    }
    if (state.mode === "audit") {
      const item = auditCases[state.auditIndex];
      return withCommon({
        part: "audit_triage",
        case_index: state.auditIndex,
        case_title: item.title,
        observed_first_digit_percent: item.observed.map((v) => Number((v * 100).toFixed(1))),
        expected_benford_percent: benford.map((v) => Number((v * 100).toFixed(1))),
        answered: state.auditAnswered,
        chosen_action: state.auditChoice,
        score: state.auditScore,
        feedback: state.lastFeedback,
      });
    }
    return withCommon({
      mechanism_score: state.mechanismScore,
      audit_score: state.auditScore,
      feedback: state.lastFeedback,
    });
  }

  canvas.addEventListener("pointerup", handleClick);
  canvas.addEventListener("keydown", handleKey);
  window.addEventListener("resize", resizeCanvas);
  document.addEventListener("fullscreenchange", resizeCanvas);

  window.advanceTime = (ms) => {
    const steps = Math.max(1, Math.round(ms / (1000 / 60)));
    for (let i = 0; i < steps; i += 1) update(1 / 60);
    render();
  };

  window.render_game_to_text = renderGameToText;

  function frame() {
    update(1 / 60);
    render();
    requestAnimationFrame(frame);
  }

  resizeCanvas();
  frame();
})();

</script>
