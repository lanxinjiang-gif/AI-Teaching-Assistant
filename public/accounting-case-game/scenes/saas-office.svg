<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <!-- Background wall -->
  <rect width="400" height="200" fill="#eff6ff"/>
  <!-- Floor -->
  <rect y="155" width="400" height="45" fill="#bfdbfe" opacity="0.4"/>
  <rect y="153" width="400" height="4" fill="#93c5fd"/>
  <!-- Large windows -->
  <rect x="10" y="20" width="80" height="110" rx="4" fill="#dbeafe"/>
  <line x1="50" y1="20" x2="50" y2="130" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="10" y1="75" x2="90" y2="75" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="100" y="20" width="80" height="110" rx="4" fill="#dbeafe"/>
  <line x1="140" y1="20" x2="140" y2="130" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="100" y1="75" x2="180" y2="75" stroke="#93c5fd" stroke-width="1.5"/>
  <!-- Standing desk 1 -->
  <rect x="210" y="100" width="70" height="55" rx="3" fill="#1e3a5f"/>
  <rect x="210" y="95" width="70" height="8" rx="2" fill="#1e40af"/>
  <!-- Monitor on desk 1 -->
  <rect x="225" y="65" width="40" height="28" rx="3" fill="#0f172a"/>
  <rect x="227" y="67" width="36" height="22" rx="2" fill="#1d4ed8"/>
  <!-- Code/graph on screen -->
  <line x1="230" y1="72" x2="260" y2="72" stroke="#60a5fa" stroke-width="1" opacity="0.8"/>
  <line x1="230" y1="76" x2="252" y2="76" stroke="#34d399" stroke-width="1" opacity="0.8"/>
  <line x1="230" y1="80" x2="258" y2="80" stroke="#60a5fa" stroke-width="1" opacity="0.8"/>
  <line x1="230" y1="84" x2="248" y2="84" stroke="#f472b6" stroke-width="1" opacity="0.8"/>
  <rect x="242" y="93" width="6" height="4" rx="1" fill="#334155"/>
  <!-- Standing desk 2 -->
  <rect x="300" y="100" width="70" height="55" rx="3" fill="#1e3a5f"/>
  <rect x="300" y="95" width="70" height="8" rx="2" fill="#1e40af"/>
  <!-- Dual monitors desk 2 -->
  <rect x="302" y="62" width="32" height="22" rx="3" fill="#0f172a"/>
  <rect x="304" y="64" width="28" height="16" rx="2" fill="#312e81"/>
  <rect x="337" y="62" width="32" height="22" rx="3" fill="#0f172a"/>
  <rect x="339" y="64" width="28" height="16" rx="2" fill="#1e3a8a"/>
  <!-- Chart on second monitor -->
  <polyline points="341,76 347,70 353,74 359,68 365,72" stroke="#34d399" stroke-width="1.5" fill="none"/>
  <!-- Potted plant -->
  <rect x="370" y="130" width="20" height="25" rx="3" fill="#15803d"/>
  <ellipse cx="380" cy="128" rx="14" ry="18" fill="#16a34a"/>
  <ellipse cx="373" cy="122" rx="7" ry="10" fill="#15803d"/>
  <ellipse cx="387" cy="120" rx="7" ry="10" fill="#15803d"/>
  <!-- Whiteboards -->
  <rect x="210" y="20" width="90" height="55" rx="3" fill="white" stroke="#bfdbfe" stroke-width="2"/>
  <!-- Sticky notes on whiteboard -->
  <rect x="215" y="25" width="18" height="18" rx="2" fill="#fef08a"/>
  <rect x="236" y="25" width="18" height="18" rx="2" fill="#bbf7d0"/>
  <rect x="257" y="25" width="18" height="18" rx="2" fill="#fecaca"/>
  <rect x="278" y="25" width="18" height="18" rx="2" fill="#c7d2fe"/>
  <rect x="215" y="47" width="18" height="18" rx="2" fill="#fecaca"/>
  <rect x="236" y="47" width="18" height="18" rx="2" fill="#fef08a"/>
  <!-- Neon sign -->
  <rect x="310" y="22" width="75" height="28" rx="6" fill="#1e1b4b"/>
  <text x="347" y="41" text-anchor="middle" fill="#a78bfa" font-size="13" font-family="sans-serif" font-weight="bold">{"build"}</text>
</svg>
