<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <!-- Sky / wall -->
  <rect width="400" height="200" fill="#fef3c7"/>
  <!-- Floor -->
  <rect y="150" width="400" height="50" fill="#d97706" opacity="0.3"/>
  <rect y="148" width="400" height="4" fill="#b45309"/>
  <!-- Back wall shelving units -->
  <rect x="20" y="60" width="50" height="90" rx="2" fill="#92400e" opacity="0.5"/>
  <rect x="80" y="60" width="50" height="90" rx="2" fill="#92400e" opacity="0.5"/>
  <rect x="140" y="60" width="50" height="90" rx="2" fill="#92400e" opacity="0.5"/>
  <!-- Shelf rows -->
  <rect x="20" y="80" width="50" height="3" fill="#78350f"/>
  <rect x="20" y="100" width="50" height="3" fill="#78350f"/>
  <rect x="20" y="120" width="50" height="3" fill="#78350f"/>
  <rect x="80" y="80" width="50" height="3" fill="#78350f"/>
  <rect x="80" y="100" width="50" height="3" fill="#78350f"/>
  <rect x="80" y="120" width="50" height="3" fill="#78350f"/>
  <rect x="140" y="80" width="50" height="3" fill="#78350f"/>
  <rect x="140" y="100" width="50" height="3" fill="#78350f"/>
  <rect x="140" y="120" width="50" height="3" fill="#78350f"/>
  <!-- Products on shelves (colorful boxes) -->
  <rect x="23" y="68" width="10" height="12" rx="1" fill="#ef4444"/>
  <rect x="35" y="68" width="10" height="12" rx="1" fill="#3b82f6"/>
  <rect x="47" y="68" width="10" height="12" rx="1" fill="#22c55e"/>
  <rect x="23" y="88" width="10" height="12" rx="1" fill="#f59e0b"/>
  <rect x="35" y="88" width="10" height="12" rx="1" fill="#8b5cf6"/>
  <rect x="83" y="68" width="10" height="12" rx="1" fill="#06b6d4"/>
  <rect x="95" y="68" width="10" height="12" rx="1" fill="#f97316"/>
  <rect x="143" y="68" width="10" height="12" rx="1" fill="#ec4899"/>
  <rect x="155" y="68" width="10" height="12" rx="1" fill="#84cc16"/>
  <!-- Cash register desk -->
  <rect x="280" y="110" width="90" height="40" rx="4" fill="#78350f"/>
  <rect x="290" y="100" width="50" height="15" rx="3" fill="#1e293b"/>
  <rect x="300" y="95" width="30" height="8" rx="2" fill="#334155"/>
  <!-- Register screen glow -->
  <rect x="293" y="103" width="44" height="9" rx="1" fill="#bfdbfe" opacity="0.8"/>
  <!-- Price tag sign -->
  <rect x="240" y="30" width="70" height="30" rx="4" fill="#dc2626"/>
  <text x="275" y="50" text-anchor="middle" fill="white" font-size="14" font-family="sans-serif" font-weight="bold">SALE</text>
  <!-- Hanging price tags -->
  <line x1="255" y1="60" x2="255" y2="80" stroke="#dc2626" stroke-width="1.5"/>
  <ellipse cx="255" cy="84" rx="6" ry="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <line x1="290" y1="60" x2="290" y2="75" stroke="#dc2626" stroke-width="1.5"/>
  <ellipse cx="290" cy="79" rx="6" ry="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <!-- Window with outside view -->
  <rect x="330" y="30" width="55" height="70" rx="3" fill="#bfdbfe"/>
  <line x1="357" y1="30" x2="357" y2="100" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="330" y1="65" x2="385" y2="65" stroke="#93c5fd" stroke-width="1.5"/>
  <!-- Sunlight rays -->
  <line x1="357" y1="30" x2="345" y2="55" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>
  <line x1="357" y1="30" x2="370" y2="55" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>
</svg>
