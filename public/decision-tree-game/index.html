<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decision Tree Builder Lab</title>
    <meta
      name="description"
      content="An interactive college study game for learning how a decision tree model is built and applied."
    />
    <style>
:root {
  --page-bg: #13302a;
  --page-bg-deep: #091d19;
  --page-panel: rgba(248, 239, 214, 0.95);
  --page-panel-strong: #f6edd2;
  --page-line: rgba(10, 32, 27, 0.12);
  --ink: #13211e;
  --ink-soft: #42514b;
  --accent: #ca5a31;
  --accent-strong: #9d3a16;
  --decision: #4b73bf;
  --decision-deep: #2b4f8f;
  --leaf: #10b95a;
  --leaf-deep: #0a8e44;
  --sports: #f1694f;
  --family: #3f79db;
  --warning: #c54831;
  --success: #12744e;
  --shadow: 0 24px 60px rgba(5, 16, 13, 0.28);
  --shadow-soft: 0 12px 26px rgba(11, 25, 20, 0.16);
  --radius-xl: 28px;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  width: 100%;
  min-height: 100vh;
  overflow-x: hidden;
  color: var(--ink);
  font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at top left, rgba(226, 173, 66, 0.18), transparent 28%),
    radial-gradient(circle at bottom right, rgba(96, 180, 162, 0.18), transparent 30%),
    linear-gradient(180deg, var(--page-bg), var(--page-bg-deep));
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
  background-size: 22px 22px;
  opacity: 0.26;
}

a {
  color: inherit;
}

.repo-return {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 1000;
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 9px 13px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(8, 30, 25, 0.92);
  color: #f9f1d5;
  box-shadow: 0 10px 24px rgba(5, 16, 13, 0.2);
  font-size: 0.9rem;
  font-weight: 800;
  text-decoration: none;
}

.repo-return:hover,
.repo-return:focus-visible {
  background: rgba(255, 250, 240, 0.96);
  color: var(--ink);
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.lesson-shell {
  width: 100%;
  margin: 0 auto;
  padding: 16px;
  position: relative;
  z-index: 1;
}

.hero {
  position: relative;
  overflow: hidden;
  padding: 22px;
  border-radius: 8px;
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04)),
    linear-gradient(160deg, rgba(247, 190, 112, 0.17), rgba(255, 255, 255, 0.05));
  border: 1px solid rgba(255, 255, 255, 0.16);
  color: #f8f4e8;
  box-shadow: var(--shadow);
}

.hero::after {
  content: "";
  position: absolute;
  inset: auto -48px -42px auto;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(250, 216, 152, 0.34), transparent 70%);
}

.hero__eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  color: #ffe8b4;
  font-size: 0.84rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.hero__grid {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(300px, 0.9fr);
  gap: 24px;
  align-items: end;
}

.hero h1 {
  margin: 16px 0 10px;
  font-family: "Rockwell", "Georgia", serif;
  font-size: clamp(2rem, 4vw, 3.4rem);
  line-height: 0.96;
  letter-spacing: -0.03em;
}

.hero p {
  margin: 0;
  max-width: 58ch;
  color: rgba(248, 244, 232, 0.9);
  font-size: 1.05rem;
  line-height: 1.58;
}

.hero__meta {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.hero-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  background: rgba(7, 16, 13, 0.18);
  font-size: 0.94rem;
}

.hero-chip strong {
  color: #fff8e5;
}

.hero__actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 12px;
  align-self: start;
}

.mastery-card {
  padding: 18px 18px 16px;
  border-radius: 22px;
  background: rgba(6, 18, 14, 0.32);
  border: 1px solid rgba(255, 255, 255, 0.14);
  min-width: 280px;
}

.mastery-card__label {
  margin: 0 0 10px;
  color: #ffefb8;
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.mastery-card__value {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.mastery-card__value strong {
  font-family: "Rockwell", "Georgia", serif;
  font-size: 2rem;
}

.mastery-card__value span {
  color: rgba(248, 244, 232, 0.82);
}

.mastery-meter {
  height: 14px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.14);
  overflow: hidden;
}

.mastery-meter span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #ffd46b, #ff8a47);
  transition: width 220ms ease;
}

.top-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.phase-rail {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 12px;
  margin: 14px 0;
}

.phase-pill {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 68px;
  padding: 14px 16px;
  border-radius: 18px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  background: rgba(245, 238, 219, 0.11);
  color: #f7f1db;
  text-align: left;
  transition:
    transform 180ms ease,
    border-color 180ms ease,
    background 180ms ease,
    box-shadow 180ms ease;
}

.phase-pill:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.phase-pill:not(:disabled):hover {
  transform: translateY(-1px);
  border-color: rgba(255, 225, 159, 0.32);
}

.phase-pill__index {
  flex: 0 0 38px;
  width: 38px;
  height: 38px;
  display: inline-grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.14);
  font-size: 0.84rem;
  font-weight: 700;
}

.phase-pill__text strong {
  display: block;
  margin-bottom: 3px;
  font-size: 0.95rem;
}

.phase-pill__text span {
  font-size: 0.79rem;
  color: rgba(247, 241, 219, 0.8);
}

.phase-pill.is-current {
  background: linear-gradient(135deg, rgba(255, 215, 117, 0.28), rgba(255, 113, 66, 0.2));
  border-color: rgba(255, 222, 146, 0.42);
  box-shadow: 0 14px 28px rgba(15, 28, 23, 0.24);
}

.phase-pill.is-complete {
  background: linear-gradient(135deg, rgba(23, 147, 94, 0.34), rgba(53, 203, 154, 0.14));
}

.phase-pill.is-current .phase-pill__index,
.phase-pill.is-complete .phase-pill__index {
  background: rgba(247, 241, 219, 0.2);
}

.workspace {
  display: grid;
  grid-template-columns: minmax(360px, 0.82fr) minmax(560px, 1.18fr);
  gap: 14px;
  min-height: calc(100svh - 318px);
}

.panel {
  position: relative;
  overflow: hidden;
  min-height: max(650px, calc(100svh - 318px));
  padding: 24px;
  border-radius: 8px;
  background: var(--page-panel);
  box-shadow: var(--shadow-soft);
}

.panel::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.5), transparent 22%),
    linear-gradient(90deg, rgba(255, 255, 255, 0.18), transparent 12%);
  opacity: 0.72;
}

.panel > * {
  position: relative;
  z-index: 1;
}

.lesson-panel {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.panel-header__eyebrow {
  margin: 0 0 8px;
  color: var(--accent-strong);
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.panel-header h2 {
  margin: 0 0 10px;
  font-family: "Rockwell", "Georgia", serif;
  font-size: clamp(1.7rem, 3vw, 2.4rem);
  line-height: 1.02;
  letter-spacing: -0.03em;
}

.panel-header p {
  margin: 0;
  color: var(--ink-soft);
  line-height: 1.6;
}

.prompt-card,
.note-card,
.summary-card,
.feedback-card,
.status-card,
.rule-card,
.future-card,
.dataset-card {
  padding: 18px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--page-line);
  background: rgba(255, 255, 255, 0.64);
}

.prompt-card h3,
.note-card h3,
.summary-card h3,
.status-card h3,
.dataset-card h3,
.future-card h3 {
  margin: 0 0 10px;
  font-size: 1.05rem;
}

.prompt-card p,
.note-card p,
.summary-card p,
.status-card p,
.dataset-card p,
.future-card p,
.feedback-card p {
  margin: 0;
  line-height: 1.55;
  color: var(--ink-soft);
}

.feedback-card {
  border-width: 2px;
  animation: revealCard 220ms ease;
}

.feedback-card--info {
  background: rgba(75, 115, 191, 0.08);
  border-color: rgba(75, 115, 191, 0.24);
}

.feedback-card--success {
  background: rgba(18, 116, 78, 0.1);
  border-color: rgba(18, 116, 78, 0.28);
}

.feedback-card--warning {
  background: rgba(197, 72, 49, 0.1);
  border-color: rgba(197, 72, 49, 0.26);
}

.feedback-card strong {
  display: block;
  margin-bottom: 6px;
  color: var(--ink);
}

.option-grid,
.rule-grid,
.future-grid,
.summary-grid,
.metric-grid,
.chip-row,
.action-row,
.lesson-stack {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.option-grid {
  margin-top: 16px;
}

.option-button,
.small-button,
.phase-jump,
.split-card {
  border: 1px solid rgba(14, 35, 29, 0.14);
  background: #fffaf0;
  color: var(--ink);
  transition:
    transform 160ms ease,
    box-shadow 160ms ease,
    border-color 160ms ease,
    background 160ms ease;
}

.option-button,
.small-button,
.phase-jump {
  padding: 14px 16px;
  border-radius: 16px;
  box-shadow: 0 6px 16px rgba(17, 31, 26, 0.08);
}

.option-button {
  flex: 1 1 160px;
  min-height: 68px;
  text-align: left;
}

.option-button strong {
  display: block;
  margin-bottom: 4px;
  font-size: 1rem;
}

.option-button span {
  color: var(--ink-soft);
  font-size: 0.92rem;
  line-height: 1.45;
}

.option-button:not(:disabled):hover,
.small-button:not(:disabled):hover,
.phase-jump:not(:disabled):hover,
.split-card:not(:disabled):hover {
  transform: translateY(-1px);
  border-color: rgba(202, 90, 49, 0.34);
  box-shadow: 0 12px 24px rgba(13, 27, 22, 0.14);
}

.option-button.is-correct,
.split-card.is-correct {
  border-color: rgba(18, 116, 78, 0.38);
  background: rgba(18, 116, 78, 0.09);
}

.option-button.is-wrong,
.split-card.is-wrong {
  border-color: rgba(197, 72, 49, 0.34);
  background: rgba(197, 72, 49, 0.08);
}

.small-button,
.phase-jump {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
}

.small-button--accent {
  background: linear-gradient(135deg, #ffd980, #ff8f54);
  border-color: rgba(157, 58, 22, 0.3);
}

.small-button--ghost {
  background: rgba(255, 255, 255, 0.46);
}

.small-button--chalk {
  background: rgba(8, 30, 25, 0.88);
  border-color: rgba(255, 255, 255, 0.1);
  color: #f9f1d5;
}

.status-card {
  display: grid;
  gap: 12px;
}

.metric-grid {
  justify-content: space-between;
}

.metric-pill {
  flex: 1 1 150px;
  padding: 14px 16px;
  border-radius: 16px;
  background: rgba(19, 33, 30, 0.06);
}

.metric-pill strong {
  display: block;
  font-size: 1.2rem;
  margin-bottom: 4px;
}

.metric-pill span {
  color: var(--ink-soft);
  font-size: 0.9rem;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border-radius: 999px;
  background: rgba(19, 33, 30, 0.08);
  color: var(--ink);
  font-size: 0.91rem;
}

.chip strong {
  font-weight: 700;
}

.phase-footer {
  margin-top: auto;
  padding-top: 8px;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 12px;
}

.phase-footer__left,
.phase-footer__right {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.lab-panel {
  display: grid;
  gap: 18px;
  align-content: start;
}

.lab-intro {
  display: grid;
  gap: 12px;
}

.legend-card {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 16px 18px;
  border-radius: var(--radius-lg);
  background: rgba(13, 35, 29, 0.06);
  border: 1px solid var(--page-line);
}

.legend-chip {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.78);
}

.legend-chip__dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
}

.legend-chip__dot--decision {
  background: linear-gradient(135deg, var(--decision), var(--decision-deep));
}

.legend-chip__dot--leaf {
  background: linear-gradient(135deg, var(--leaf), var(--leaf-deep));
}

.legend-chip__dot--sports {
  background: var(--sports);
}

.legend-chip__dot--family {
  background: var(--family);
}

.tree-board {
  position: relative;
  min-height: 100%;
  display: grid;
  align-items: center;
  padding: 14px;
  border-radius: 8px;
  border: 1px solid rgba(19, 33, 30, 0.09);
  background:
    radial-gradient(circle at top, rgba(255, 226, 178, 0.46), transparent 34%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(250, 244, 224, 0.9));
  overflow: hidden;
}

.tree-viewport {
  width: 100%;
  max-width: none;
  margin: 0;
  aspect-ratio: 820 / 650;
}

.tree-board::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(18, 31, 27, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(18, 31, 27, 0.035) 1px, transparent 1px);
  background-size: 24px 24px;
  opacity: 0.5;
}

.tree-svg {
  width: 100%;
  height: 100%;
  display: block;
}

.tree-branch line {
  stroke: rgba(26, 41, 36, 0.28);
  stroke-width: 3.5;
  stroke-linecap: round;
  vector-effect: non-scaling-stroke;
  transition: stroke 180ms ease, stroke-width 180ms ease, filter 180ms ease;
}

.tree-branch text {
  fill: rgba(24, 40, 35, 0.82);
  font-family: "Avenir Next", "Trebuchet MS", sans-serif;
  font-size: 18px;
  font-weight: 700;
}

.tree-branch.is-active line {
  stroke: var(--accent-strong);
  stroke-width: 5;
  filter: drop-shadow(0 0 10px rgba(202, 90, 49, 0.28));
}

.tree-branch.is-active text {
  fill: var(--accent-strong);
}

.tree-node {
  transform-box: fill-box;
  transform-origin: center;
  transition:
    transform 180ms ease,
    filter 180ms ease,
    opacity 180ms ease;
}

.tree-node-shape {
  vector-effect: non-scaling-stroke;
  stroke: rgba(20, 31, 28, 0.18);
  stroke-width: 1.5;
  filter: drop-shadow(0 10px 16px rgba(18, 30, 26, 0.15));
}

.tree-node-text {
  fill: #fffef9;
  font-family: "Avenir Next", "Trebuchet MS", sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.01em;
  pointer-events: none;
}

.tree-node--decision .tree-node-shape {
  fill: url(#treeDecisionGradient);
}

.tree-node--leaf .tree-node-shape {
  fill: url(#treeLeafGradient);
}

.tree-node--placeholder {
  color: var(--ink);
}

.tree-node--placeholder .tree-node-shape {
  fill: rgba(255, 255, 255, 0.72);
  stroke: rgba(19, 33, 30, 0.28);
  stroke-dasharray: 7 7;
  filter: none;
}

.tree-node--placeholder .tree-node-text {
  fill: var(--ink);
}

.tree-node--dim {
  opacity: 0.42;
}

.tree-node.is-active {
  filter: drop-shadow(0 0 16px rgba(202, 90, 49, 0.24));
  animation: pulseNode 1.8s ease-in-out infinite;
}

.tree-node.is-active .tree-node-shape {
  stroke: rgba(202, 90, 49, 0.56);
  stroke-width: 2.4;
}

.tree-badge {
  filter: drop-shadow(0 10px 18px rgba(34, 17, 12, 0.18));
}

.tree-badge rect {
  fill: url(#treeBadgeGradient);
}

.tree-badge text {
  fill: #fff7ea;
  font-family: "Avenir Next", "Trebuchet MS", sans-serif;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.01em;
}

.split-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.split-card {
  width: 100%;
  padding: 18px;
  border-radius: 22px;
  text-align: left;
}

.split-card__top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: baseline;
  margin-bottom: 10px;
}

.split-card__top strong {
  font-size: 1.16rem;
}

.split-card__score {
  font-size: 0.92rem;
  color: var(--ink-soft);
}

.split-card p {
  margin: 0 0 14px;
  color: var(--ink-soft);
  line-height: 1.5;
}

.split-leaf {
  padding: 12px 14px;
  border-radius: 18px;
  background: rgba(19, 33, 30, 0.05);
}

.split-leaf + .split-leaf {
  margin-top: 10px;
}

.split-leaf__row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
  font-size: 0.93rem;
}

.mix-bar {
  display: flex;
  height: 12px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(19, 33, 30, 0.08);
}

.mix-bar__sports {
  background: var(--sports);
}

.mix-bar__family {
  background: var(--family);
}

.purity-meter {
  margin-top: 14px;
  display: grid;
  gap: 8px;
}

.purity-meter__track {
  height: 14px;
  border-radius: 999px;
  background: rgba(19, 33, 30, 0.08);
  overflow: hidden;
}

.purity-meter__track span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #ffd15d, #ff7f55);
}

.dataset-wrap,
.future-wrap {
  overflow-x: auto;
  border-radius: 18px;
  border: 1px solid var(--page-line);
  background: rgba(255, 255, 255, 0.75);
}

.dataset-table,
.future-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 620px;
}

.dataset-table caption,
.future-table caption {
  padding: 14px 16px;
  text-align: left;
  font-weight: 700;
  color: var(--ink-soft);
  background: rgba(19, 33, 30, 0.04);
}

.dataset-table th,
.dataset-table td,
.future-table th,
.future-table td {
  padding: 12px 14px;
  border-bottom: 1px solid rgba(19, 33, 30, 0.08);
  text-align: left;
}

.dataset-table thead th,
.future-table thead th {
  position: sticky;
  top: 0;
  background: rgba(249, 246, 236, 0.98);
  z-index: 1;
  font-size: 0.92rem;
}

.dataset-table th.label-column,
.dataset-table td.label-column,
.future-table td.predicted-column,
.future-table th.predicted-column {
  background: rgba(16, 185, 90, 0.08);

function createInitialState() {
  return {
    phaseIndex: 0,
    unlockedPhaseIndex: 0,
    checkpoints: [],
    completedPhases: [],
    feedback: {
      tone: "info",
      title: "Welcome to the lab",
      text: "Start by identifying what counts as a decision node and what counts as a leaf.",
    },
    introStep: 0,
    dataAnswered: false,
    splitChoice: null,
    growStep: 0,
    treeBuild: {
      genderPlaced: false,
      incomePlaced: false,

function createApplyState() {
  return {
    recordIndex: 0,
    currentNode: "marital",
    pathBranches: [],
    resolved: false,
    leafId: null,
    lastPrediction: null,
    completed: [],
  };
}

function handleAction(action, value) {
  if (action === "restart-lab") {
    state = createInitialState();
    render();
    return;
  }

  if (action === "go-phase") {
    const index = Number(value);
    if (Number.isFinite(index) && index <= state.unlockedPhaseIndex) {
      state.phaseIndex = index;
      render();
    }
    return;
  }

  if (action === "next-phase") {
    if (state.phaseIndex < state.unlockedPhaseIndex) {
      state.phaseIndex += 1;
      render();
    }
    return;
  }

  if (action === "prev-phase") {
    if (state.phaseIndex > 0) {
      state.phaseIndex -= 1;
      render();
    }
    return;
  }

  if (action === "replay-apply") {
    state.apply = createApplyState();
    state.phaseIndex = phaseIndexFor("apply-the-tree");
    render();
    return;
  }

  if (action === "next-record") {
    advanceApplyRecord();
    render();
    return;
  }

  const phaseId = currentPhase().id;
  if (phaseId === "intro" && action === "choose-intro") {
    handleIntroChoice(value);
    render();
    return;
  }

  if (phaseId === "learn-from-data" && action === "choose-label") {
    handleLabelChoice(value);
    render();
    return;
  }

  if (phaseId === "pick-the-best-split" && action === "choose-split") {
    handleSplitChoice(value);
    render();
    return;
  }

  if (phaseId === "grow-the-tree" && action === "choose-grow") {
    handleGrowChoice(value);
    render();
    return;
  }

  if (phaseId === "apply-the-tree" && action === "apply-choice") {
    handleApplyChoice(value);
    render();
  }
}

function currentPhase() {
  return PHASES[state.phaseIndex];
}

function phaseIndexFor(id) {
  return PHASES.findIndex((phase) => phase.id === id);
}

function setFeedback(title, text, tone = "info") {
  state.feedback = { title, text, tone };
}

function awardCheckpoint(id) {
  if (!state.checkpoints.includes(id)) {
    state.checkpoints = state.checkpoints.concat(id);
  }
}

function phaseComplete(id) {
  return state.completedPhases.includes(id);
}

function completePhase(id, title, text) {
  if (!phaseComplete(id)) {
    state.completedPhases = state.completedPhases.concat(id);
    const index = phaseIndexFor(id);
    state.unlockedPhaseIndex = Math.max(
      state.unlockedPhaseIndex,
      Math.min(PHASES.length - 1, index + 1),
    );
  }
  setFeedback(title, text, "success");
}

function handleIntroChoice(value) {
  if (state.introStep === 0) {
    if (value === "marital") {
      awardCheckpoint("intro-node");
      state.introStep = 1;
      setFeedback(
        "Correct",
        "Decision nodes ask questions that split the data. Now identify a leaf that stores the class label.",
        "success",
      );
      return;
    }

    setFeedback(
      "Try again",
      "Sports Car and Family Car are outcomes, not questions. A decision node asks something like 'What is the marital status?'",
      "warning",
    );
    return;
  }

  if (value === "family") {
    awardCheckpoint("intro-leaf");
    state.introStep = 2;
    completePhase(
      "intro",
      "Nice work",
      "You found both tree parts: decision nodes ask questions, and leaves hold the predicted class label.",
    );
    return;
  }

  setFeedback(
    "Almost",
    "Annual Income and Gender are still question points. A leaf is an end result like Family Car or Sports Car.",
    "warning",
  );
}

function handleLabelChoice(value) {
  state.dataAnswered = true;
  if (value === "carType") {
    awardCheckpoint("data-label");
    completePhase(
      "learn-from-data",
      "Exactly",
      "Car type is the class label. The other columns act as features the tree uses to sort buyers.",
    );

  }

  setFeedback(
    "Not quite",

function handleSplitChoice(value) {
  state.splitChoice = value;
  if (value === "maritalStatus") {
    awardCheckpoint("split-root");
    completePhase(

function handleGrowChoice(value) {
  const step = state.growStep;

  if (step === 0) {
    if (value === "married") {
      awardCheckpoint("grow-married-branch");
      state.growStep = 1;
      setFeedback(
        "Good read",
        "The Single branch is already clean enough to become a Sports Car leaf, so we keep growing the Married side.",

    setFeedback(

    setFeedback(

    );
    return;
  }

  if (step === 2) {
    if (value === "male") {
      awardCheckpoint("grow-male-branch");
      state.growStep = 3;
      setFeedback(
        "Right branch",
        "Female buyers are already a Family Car leaf. The Male branch still mixes two classes, so it needs one more question.",

    }

    setFeedback(
      "Look for the mixed branch",
      "Female is already clean. Male still contains both Sports Car and Family Car buyers, so that branch needs more work.",
      "warning",
    );
    return;
  }

  if (value === "annualIncome") {

    state.growStep = 4;
    state.treeBuild.incomePlaced = true;
    completePhase(

  setFeedback(

    "The Male branch still needs a split based on Annual Income. That is what produces the final two leaves in the lecture tree.",

function handleApplyChoice(value) {
  const record = FUTURE_ROWS[state.apply.recordIndex];
  if (!record || state.apply.resolved) {
    return;
  }

  const node = state.apply.currentNode;
  const expected = expectedApplyChoice(record, node);
  if (value !== expected) {
    setFeedback("Try that branch again", wrongApplyMessage(record, node), "warning");
    return;
  }

  if (node === "marital") {
    state.apply.pathBranches = state.apply.pathBranches.concat(value);
    if (value === "single") {
      finishApplyRecord(record, "Sports Car", "sports-single");
      return;
    }

    state.apply.currentNode = "gender";
    setFeedback(
      "Correct branch",
      `Client ${record.id} is Married, so the tree moves to the Gender decision next.`,
      "success",
    );
    return;
  }

  if (node === "gender") {
    state.apply.pathBranches = state.apply.pathBranches.concat(value);
    if (value === "female") {
      finishApplyRecord(record, "Family Car", "family-female");
      return;
    }

    state.apply.currentNode = "income";
    setFeedback(
      "Keep going",
      `Client ${record.id} is Male, so the tree needs one more split on Annual Income.`,
      "success",
    );
    return;
  }

  state.apply.pathBranches = state.apply.pathBranches.concat(value);
  if (value === "income-low") {
    finishApplyRecord(record, "Family Car", "family-income");
    return;
  }

  finishApplyRecord(record, "Sports Car", "sports-income");

function finishApplyRecord(record, prediction, leafId) {
  awardCheckpoint(`apply-${record.id}`);
  state.apply.resolved = true;
  state.apply.leafId = leafId;
  state.apply.lastPrediction = prediction;

  if (!state.apply.completed.some((entry) => entry.id === record.id)) {
    state.apply.completed = state.apply.completed.concat({ id: record.id, prediction });
  }

  const isLastRecord = state.apply.recordIndex === FUTURE_ROWS.length - 1;
  if (isLastRecord) {
    completePhase(
      "apply-the-tree",
      "All future clients classified",
      "You traced every record from the root to a leaf, just like the slide walkthrough.",
    );
    return;
  }

  setFeedback(
    "Prediction complete",
    `Client ${record.id} reaches the ${prediction} leaf. Move to the next future client when you are ready.`,
    "success",
  );
}

function advanceApplyRecord() {
  if (!state.apply.resolved) {
    return;
  }

  const isLastRecord = state.apply.recordIndex === FUTURE_ROWS.length - 1;
  if (isLastRecord) {
    state.phaseIndex = phaseIndexFor("wrap-up");
    return;
  }

  state.apply.recordIndex += 1;
  state.apply.currentNode = "marital";
  state.apply.pathBranches = [];
  state.apply.resolved = false;
  state.apply.leafId = null;
  state.apply.lastPrediction = null;
  setFeedback(
    "New client loaded",
    `Start Client ${FUTURE_ROWS[state.apply.recordIndex].id} at the root of the tree.`,
    "info",
  );
}

function expectedApplyChoice(record, node) {
  if (node === "marital") {
    return record.maritalStatus.toLowerCase();
  }

  if (node === "gender") {
    return record.gender.toLowerCase();
  }

  return record.annualIncome <= 100 ? "income-low" : "income-high";
}

function wrongApplyMessage(record, node) {
  if (node === "marital") {
    return `Client ${record.id} is ${record.maritalStatus}, so the first move must follow the ${record.maritalStatus} branch.`;
  }

  if (node === "gender") {
    return `On the Married branch, the tree now checks Gender. Client ${record.id} is ${record.gender}, so follow that branch next.`;
  }

  return `Client ${record.id} has income ${record.incomeText}, so compare it with the 100K threshold before choosing the branch.`;
}

function growSummaryText() {
  if (state.growStep === 0) {
    return "Root fixed: Marital Status. The next job is to see which branch still needs more splitting.";
  }

  if (state.growStep === 1) {
    return "Single is already a Sports Car leaf. Married still needs one more decision node.";
  }

  if (state.growStep === 2) {
    return "Gender now sits under Married, and the Female branch already looks clean.";
  }

  if (state.growStep === 3) {
    return "Male remains mixed, so the tree needs one final split to finish the model.";
  }

  return "The final structure matches the lecture: root on Marital Status, then Gender under Married, then Annual Income under Married + Male.";
}

function summarizeRows(rows, label) {
  let sports = 0;
  let family = 0;

  for (const row of rows) {
    if (row.carType === "Sports Car") {
      sports += 1;
    } else if (row.carType === "Family Car") {
      family += 1;
    }
  }

  const total = sports + family;
  const dominant = Math.max(sports, family);
  const purity = total ? Math.round((dominant / total) * 100) : 0;
  let majority = "Mixed";

  if (sports > family) {
    majority = "Mostly Sports Car";
  } else if (family > sports) {
    majority = "Mostly Family Car";
  } else if (total > 0) {
    majority = "Even split";
  }

  return {
    label,
    sports,
    family,
    total,
    purity,
    majority,
    dominant,
    isPure: total > 0 && purity === 100,
  };
}

function formatClassCounts(summary) {
  return `${summary.sports} Sports / ${summary.family} Family`;
}

function getGrowPurityStats() {
  const singleRows = TRAINING_ROWS.filter((row) => row.maritalStatus === "Single");
  const marriedRows = TRAINING_ROWS.filter((row) => row.maritalStatus === "Married");
  const marriedFemaleRows = marriedRows.filter((row) => row.gender === "Female");
  const marriedMaleRows = marriedRows.filter((row) => row.gender === "Male");
  const maleLowRows = marriedMaleRows.filter((row) => row.annualIncome <= 100);
  const maleHighRows = marriedMaleRows.filter((row) => row.annualIncome > 100);

  return {
    all: summarizeRows(TRAINING_ROWS, "All training rows"),
    single: summarizeRows(singleRows, "Single branch"),
    married: summarizeRows(marriedRows, "Married branch"),
    female: summarizeRows(marriedFemaleRows, "Married + Female"),
    male: summarizeRows(marriedMaleRows, "Married + Male"),
    maleLow: summarizeRows(maleLowRows, "Male + <=100K"),
    maleHigh: summarizeRows(maleHighRows, "Male + >100K"),
  };
}

function renderWrapUpPurityJourney() {
  const stats = getGrowPurityStats();
  return `
    <section class="note-card">
      <h3>How purity improved step by step</h3>
      <p>In the 10-row lecture example, each question cleans up the data until every ending branch becomes pure.</p>
      <div class="journey-grid">
        ${renderPurityStage("Before splitting", "All past buyers begin in one mixed root group.", [stats.all])}
        ${renderPurityStage("After Marital Status", "Single is pure, but Married still needs help.", [stats.single, stats.married])}
        ${renderPurityStage("After Gender on Married", "Female becomes pure, while Male stays mixed.", [stats.female, stats.male])}
        ${renderPurityStage("After Annual Income on Married + Male", "The last split creates two clean ending leaves.", [stats.maleLow, stats.maleHigh])}
      </div>
    </section>
  `;
}

function renderPurityStage(title, description, summaries) {
  return `
    <article class="journey-card">
      <h4>${title}</h4>
      <p>${description}</p>
      <div class="journey-mini-grid">
        ${summaries.map((summary) => renderPurityMini(summary)).join("")}
      </div>
    </article>
  `;
}

function renderPurityMini(summary) {
  return `
    <div class="journey-mini">
      <strong>${summary.label}</strong>
      <span>${summary.sports} Sports / ${summary.family} Family</span>
      ${renderPurityBar(summary)}
      <em>${summary.purity}% pure</em>
    </div>
  `;
}

function renderWrapUpCaseReview() {
  return `
    <section class="future-card">
      <h3>Future client review</h3>
      <p>These are the full paths the model follows for the five future clients from slide 22.</p>
      <div class="future-wrap">
        <table class="future-table future-table--review">
          <thead>
            <tr>
              <th>Client</th>
              <th>Path through the tree</th>
              <th>Rule used</th>
              <th class="predicted-column">Prediction</th>
            </tr>
          </thead>
          <tbody>
            ${FUTURE_ROWS.map(
              (record) => `
                <tr class="is-complete">
                  <td>${record.id}</td>
                  <td>${escapeHtml(classificationPath(record))}</td>
                  <td>${escapeHtml(ruleForRecord(record))}</td>
                  <td class="predicted-column">${classifyRecord(record)}</td>
                </tr>
              `,
            ).join("")}
          </tbody>
        </table>
      </div>
    </section>
  `;
}

function classificationPath(record) {
  const segments = [`Marital Status: ${record.maritalStatus}`];

  if (record.maritalStatus === "Single") {
    segments.push("Sports Car leaf");
    return segments.join(" -> ");
  }

  segments.push(`Gender: ${record.gender}`);
  if (record.gender === "Female") {
    segments.push("Family Car leaf");
    return segments.join(" -> ");
  }

  segments.push(`Annual Income: ${record.annualIncome <= 100 ? "<=100K" : ">100K"}`);
  segments.push(`${classifyRecord(record)} leaf`);
  return segments.join(" -> ");
}

function ruleForRecord(record) {
  if (record.maritalStatus === "Single") {
    return "Rule 1: Single -> Sports Car";
  }

  if (record.gender === "Female") {
    return "Rule 2: Married + Female -> Family Car";
  }

  if (record.annualIncome <= 100) {
    return "Rule 3: Married + Male + <=100K -> Family Car";
  }

  return "Rule 4: Married + Male + >100K -> Sports Car";
}

function renderLabPanel() {
  const phaseId = currentPhase().id;
  if (phaseId === "learn-from-data") {
    return `
      <section class="dataset-card">
        <h3>Training set from slide 19</h3>
        <p>These 10 labeled examples teach the model what counts as a Sports Car buyer versus a Family Car buyer.</p>
      </section>
      ${renderTrainingTable()}
    `;
  }

  if (phaseId === "pick-the-best-split") {
    return `
      <section class="lab-intro">
        <div class="legend-card">
          <span class="legend-chip"><span class="legend-chip__dot legend-chip__dot--sports"></span> Sports Car count</span>
          <span class="legend-chip"><span class="legend-chip__dot legend-chip__dot--family"></span> Family Car count</span>
        </div>
      </section>
      <section class="split-grid">
        ${SPLIT_CANDIDATES.map(renderSplitCard).join("")}
      </section>
    `;
  }

  if (phaseId === "apply-the-tree") {
    return `
      <section class="legend-card">
        <span class="legend-chip"><span class="legend-chip__dot legend-chip__dot--decision"></span> Decision node</span>
        <span class="legend-chip"><span class="legend-chip__dot legend-chip__dot--leaf"></span> Leaf</span>
      </section>
      ${renderTreeBoard(treeOptionsForCurrentPhase())}
      ${renderFutureTable()}
    `;
  }

  if (phaseId === "wrap-up") {
    return `
      <section class="legend-card">
        <span class="legend-chip"><span class="legend-chip__dot legend-chip__dot--decision"></span> Decision node</span>
        <span class="legend-chip"><span class="legend-chip__dot legend-chip__dot--leaf"></span> Leaf</span>
        <span class="legend-chip"><span class="legend-chip__dot legend-chip__dot--sports"></span> Sports Car outcome</span>
        <span class="legend-chip"><span class="legend-chip__dot legend-chip__dot--family"></span> Family Car outcome</span>
      </section>
      ${renderTreeBoard(treeOptionsForCurrentPhase())}
      ${renderFutureTable(true)}
    `;
  }

  return `
    <section class="legend-card">
      <span class="legend-chip"><span class="legend-chip__dot legend-chip__dot--decision"></span> Decision node</span>
      <span class="legend-chip"><span class="legend-chip__dot legend-chip__dot--leaf"></span> Leaf</span>
    </section>
    ${renderTreeBoard(treeOptionsForCurrentPhase())}
  `;
}

function renderTrainingTable() {
  return `
    <div class="dataset-wrap">
      <table class="dataset-table">
        <caption>Training records used to learn the tree</caption>
        <thead>
          <tr>
            <th>ID</th>
            <th>Marital Status</th>
            <th>Gender</th>
            <th>Annual Income</th>
            <th class="label-column">Car Type</th>
          </tr>
        </thead>
        <tbody>
          ${TRAINING_ROWS.map(
            (row) => `
              <tr>
                <td>${row.id}</td>
                <td>${row.maritalStatus}</td>
                <td>${row.gender}</td>
                <td>${row.incomeText}</td>
                <td class="label-column">${row.carType}</td>
              </tr>
            `,
          ).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function renderSplitCard(candidate) {
  const purity = Math.round(candidatePurity(candidate) * 100);
  const isSelected = state.splitChoice === candidate.id;
  const classes = ["split-card"];
  if (isSelected) {
    classes.push(candidate.id === "maritalStatus" ? "is-correct" : "is-wrong");
  }

  return `
    <button
      type="button"
      class="${classes.join(" ")}"
      data-action="choose-split"
      data-value="${candidate.id}"
      aria-pressed="${isSelected ? "true" : "false"}"
    >
      <div class="split-card__top">
        <strong>${candidate.label}</strong>
        <span class="split-card__score">${purity}% clean</span>
      </div>
      <p>${candidate.summary}</p>
      ${candidate.leaves
        .map((leaf) => {
          const total = leaf.sports + leaf.family;
          const sportsWidth = Math.round((leaf.sports / total) * 100);
          const familyWidth = 100 - sportsWidth;
          return `
            <div class="split-leaf">
              <div class="split-leaf__row">
                <span>${leaf.label}</span>
                <span>${leaf.sports} sports / ${leaf.family} family</span>
              </div>
              <div class="mix-bar" aria-hidden="true">
                <span class="mix-bar__sports" style="width:${sportsWidth}%"></span>
                <span class="mix-bar__family" style="width:${familyWidth}%"></span>
              </div>
            </div>
          `;
        })
        .join("")}
      <div class="purity-meter">
        <div class="purity-meter__track" aria-hidden="true">
          <span style="width:${purity}%"></span>
        </div>
      </div>
    </button>
  `;
}

function candidatePurity(candidate) {
  const dominant = candidate.leaves.reduce(
    (sum, leaf) => sum + Math.max(leaf.sports, leaf.family),
    0,
  );
  const total = candidate.leaves.reduce((sum, leaf) => sum + leaf.sports + leaf.family, 0);
  return dominant / total;
}

function renderFutureTable(showAllPredictions = false) {
  const completedMap = new Map(state.apply.completed.map((entry) => [entry.id, entry.prediction]));

  return `
    <div class="future-wrap">
      <table class="future-table">
        <caption>Future clients to classify</caption>
        <thead>
          <tr>
            <th>ID</th>
            <th>Marital Status</th>
            <th>Gender</th>
            <th>Annual Income</th>
            <th class="predicted-column">Prediction</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          ${FUTURE_ROWS.map((row, index) => {
            const isCurrent = index === state.apply.recordIndex && currentPhase().id === "apply-the-tree";
            const completedPrediction = completedMap.get(row.id);
            const predicted = showAllPredictions ? classifyRecord(row) : completedPrediction;
            const rowClasses = [];
            if (isCurrent) {
              rowClasses.push("is-current");
            }
            if (completedPrediction || (showAllPredictions && predicted)) {
              rowClasses.push("is-complete");
            }

            return `
              <tr class="${rowClasses.join(" ")}">
                <td>${row.id}</td>
                <td>${row.maritalStatus}</td>
                <td>${row.gender}</td>
                <td>${row.incomeText}</td>
                <td class="predicted-column">${predicted || "?"}</td>
                <td>
                  ${
                    completedPrediction || (showAllPredictions && predicted)
                      ? '<span class="badge badge--done">Done</span>'
                      : '<span class="badge badge--pending">Pending</span>'
                  }
                </td>
              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function classifyRecord(record) {
  if (record.maritalStatus === "Single") {
    return "Sports Car";
  }

  if (record.gender === "Female") {
    return "Family Car";
  }

  return record.annualIncome <= 100 ? "Family Car" : "Sports Car";
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function renderOptionButton(action, value, title, detail) {
  return `
    <button class="option-button" type="button" data-action="${action}" data-value="${value}">
      <strong>${escapeHtml(title)}</strong>
      <span>${escapeHtml(detail)}</span>
    </button>
  `;
}

function renderPathChips(pathBranches) {
  if (!pathBranches.length) {
    return '<span class="chip"><strong>Path</strong> Root only so far</span>';
  }

  return pathBranches
    .map((branch) => `<span class="path-chip">${escapeHtml(pathLabel(branch))}</span>`)
    .join("");
}

function pathLabel(branch) {
  const labels = {
    single: "Single",
    married: "Married",
    male: "Male",
    female: "Female",
    "income-low": "<= 100K",
    "income-high": "> 100K",
  };
  return labels[branch] || branch;
}

function treeOptionsForCurrentPhase() {
  const phaseId = currentPhase().id;
  if (phaseId === "intro") {
    return {
      revealGender: true,
      revealIncome: true,
      callouts: true,
      activeNode: state.introStep === 0 ? "marital" : "family-income",
      activeBranches: [],
    };
  }

  if (phaseId === "learn-from-data" || phaseId === "pick-the-best-split") {
    return {
      revealGender: true,
      revealIncome: true,
      callouts: false,
      activeNode: null,
      activeBranches: [],
    };
  }

  if (phaseId === "grow-the-tree") {
    return {
      revealGender: state.treeBuild.genderPlaced,
      revealIncome: state.treeBuild.incomePlaced,
      callouts: false,
      activeNode: growActiveNode(),
      activeBranches: growActiveBranches(),
      placeholder: growPlaceholder(),
    };
  }

  if (phaseId === "apply-the-tree") {
    return {
      revealGender: true,
      revealIncome: true,
      callouts: false,
      activeNode: state.apply.resolved ? state.apply.leafId : state.apply.currentNode,
      activeBranches: state.apply.pathBranches,
    };
  }

  return {
    revealGender: true,
    revealIncome: true,
    callouts: false,
    activeNode: "marital",
    activeBranches: [],
  };
}

function growActiveNode() {
  switch (state.growStep) {
    case 0:
      return "marital";
    case 1:
      return "gender";
    case 2:
      return "gender";
    case 3:
      return "income";
    default:
      return "income";
  }
}

function growActiveBranches() {
  switch (state.growStep) {
    case 0:
      return ["married"];
    case 2:
      return ["married", "male"];
    case 3:
    case 4:
      return ["married", "male"];
    default:
      return [];
  }
}

function growPlaceholder() {
  if (state.growStep <= 1 && !state.treeBuild.genderPlaced) {
    return "gender";
  }

  if (state.growStep >= 2 && !state.treeBuild.incomePlaced) {
    return "income";
  }

  return null;
}

function renderTreeBoard(options) {
  const revealGender = options.revealGender;
  const revealIncome = options.revealIncome;
  const nodes = {
    marital: Object.assign({}, TREE_LAYOUT.nodes.marital, { type: "decision", label: "Marital\nStatus" }),
    sportsSingle: Object.assign({}, TREE_LAYOUT.nodes.sportsSingle, { type: "leaf", label: "Sports Car" }),
    gender: Object.assign({}, TREE_LAYOUT.nodes.gender, {
      type: revealGender ? "decision" : "placeholder",
      label: revealGender ? "Gender" : "Pick next\nquestion",
    }),
    income: Object.assign({}, TREE_LAYOUT.nodes.income, {
      type: revealIncome ? "decision" : "placeholder",
      label: revealIncome ? "Annual\nIncome" : "One more\nquestion",
    }),
    familyFemale: Object.assign({}, TREE_LAYOUT.nodes.familyFemale, { type: "leaf", label: "Family Car" }),
    familyIncome: Object.assign({}, TREE_LAYOUT.nodes.familyIncome, { type: "leaf", label: "Family Car" }),
    sportsIncome: Object.assign({}, TREE_LAYOUT.nodes.sportsIncome, { type: "leaf", label: "Sports Car" }),
  };

  const branches = [
    renderBranch(TREE_LAYOUT.branches[0], nodes, options.activeBranches.includes("single")),
    renderBranch(TREE_LAYOUT.branches[1], nodes, options.activeBranches.includes("married")),
  ];
  if (revealGender) {
    branches.push(
      renderBranch(TREE_LAYOUT.branches[2], nodes, options.activeBranches.includes("male")),
      renderBranch(TREE_LAYOUT.branches[3], nodes, options.activeBranches.includes("female")),
    );
  }
  if (revealIncome) {
    branches.push(
      renderBranch(TREE_LAYOUT.branches[4], nodes, options.activeBranches.includes("income-low")),
      renderBranch(TREE_LAYOUT.branches[5], nodes, options.activeBranches.includes("income-high")),
    );
  }
  const branchMarkup = branches.join("");

  const placeholder = options.placeholder;

  return `
    <section class="tree-board" aria-label="Decision tree visualization">
      <div class="tree-viewport">
        <svg class="tree-svg" viewBox="${TREE_LAYOUT.viewBox.x} ${TREE_LAYOUT.viewBox.y} ${TREE_LAYOUT.viewBox.width} ${TREE_LAYOUT.viewBox.height}" preserveAspectRatio="xMinYMin meet" aria-hidden="true">
          ${renderTreeDefs()}
          <g class="tree-scene" transform="translate(${TREE_LAYOUT.scene.translateX} ${TREE_LAYOUT.scene.translateY}) scale(${TREE_LAYOUT.scene.scale})">
            ${branchMarkup}
            ${renderNode("marital", nodes.marital, options.activeNode === "marital")}
            ${renderNode("sports-single", nodes.sportsSingle, options.activeNode === "sports-single")}
            ${renderNode(
              "gender",
              Object.assign({}, nodes.gender, {
                type: revealGender ? "decision" : "placeholder",
              }),
              options.activeNode === "gender" || placeholder === "gender",
              placeholder === "gender" && !revealGender,
            )}
            ${
              revealGender
                ? renderNode("family-female", nodes.familyFemale, options.activeNode === "family-female")
                : ""
            }
            ${renderNode(
              "income",
              Object.assign({}, nodes.income, {
                type: revealIncome ? "decision" : "placeholder",
              }),
              options.activeNode === "income" || placeholder === "income",
              placeholder === "income" && !revealIncome,
            )}
            ${
              revealIncome
                ? renderNode("family-income", nodes.familyIncome, options.activeNode === "family-income")
                : ""
            }
            ${
              revealIncome
                ? renderNode("sports-income", nodes.sportsIncome, options.activeNode === "sports-income")
                : ""
            }
          </g>
          ${
            options.callouts
              ? `
                ${renderTreeBadge(458, 18, 164, 38, "Decision node")}
                ${renderTreeBadge(560, 516, 88, 38, "Leaf")}
              `
              : ""
          }
        </svg>
      </div>
    </section>
  `;
}

function renderTreeDefs() {
  return `
    <defs>
      <linearGradient id="treeDecisionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#5d84d0"></stop>
        <stop offset="100%" stop-color="#2b4f8f"></stop>
      </linearGradient>
      <linearGradient id="treeLeafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1dc26a"></stop>
        <stop offset="100%" stop-color="#0a8e44"></stop>
      </linearGradient>
      <linearGradient id="treeBadgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#d7401f"></stop>
        <stop offset="100%" stop-color="#b31f10"></stop>
      </linearGradient>
    </defs>
  `;
}

function getNodeCenter(node) {
  return {
    x: node.left + (node.width / 2),
    y: node.top + (node.height / 2),
  };
}

function getConnectorPoint(node, target) {
  const center = getNodeCenter(node);
  const dx = target.x - center.x;
  const dy = target.y - center.y;
  if (!dx && !dy) {
    return center;
  }

  if (node.shape === "ellipse") {
    const rx = node.width / 2;
    const ry = node.height / 2;
    const scale = 1 / Math.sqrt(((dx * dx) / (rx * rx)) + ((dy * dy) / (ry * ry)));
    return {
      x: center.x + (dx * scale),
      y: center.y + (dy * scale),
    };
  }

  const halfWidth = node.width / 2;
  const halfHeight = node.height / 2;
  const scale = 1 / Math.max(Math.abs(dx) / halfWidth, Math.abs(dy) / halfHeight);

  return {
    x: center.x + (dx * scale),
    y: center.y + (dy * scale),
  };
}

function renderBranch(branch, nodes, active) {
  const fromCenter = getNodeCenter(nodes[branch.fromNode]);
  const toCenter = getNodeCenter(nodes[branch.toNode]);
  const sourceEdge = getConnectorPoint(nodes[branch.fromNode], toCenter);
  const targetEdge = getConnectorPoint(nodes[branch.toNode], fromCenter);
  const dx = toCenter.x - fromCenter.x;
  const dy = toCenter.y - fromCenter.y;
  const length = Math.hypot(dx, dy) || 1;
  const overlap = 8;
  const unitX = dx / length;
  const unitY = dy / length;
  const from = {
    x: sourceEdge.x + (unitX * overlap),
    y: sourceEdge.y + (unitY * overlap),
  };
  const to = {
    x: targetEdge.x - (unitX * overlap),
    y: targetEdge.y - (unitY * overlap),
  };
  const labelX = ((from.x + to.x) / 2) + branch.labelOffset.x;
  const labelY = ((from.y + to.y) / 2) + branch.labelOffset.y;

  return `
    <g class="tree-branch ${active ? "is-active" : ""}" data-branch="${branch.id}">
      <line x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}"></line>
      <text x="${labelX}" y="${labelY}" text-anchor="middle">${escapeHtml(branch.label)}</text>
    </g>
  `;
}

function renderNode(id, node, active, placeholderGlow = false) {
  const classes = ["tree-node", `tree-node--${node.type}`];
  if (active) {
    classes.push("is-active");
  }
  if (placeholderGlow) {
    classes.push("is-active");
  }

  const lines = node.label.split("\n");
  const centerX = node.width / 2;
  const startY = (node.height / 2) - (((lines.length - 1) * 16) / 2);
  const textMarkup = lines
    .map(
      (line, index) => `
        <text class="tree-node-text" x="${centerX}" y="${startY + (index * 16)}" text-anchor="middle" dominant-baseline="middle">${escapeHtml(line)}</text>
      `,
    )
    .join("");

  const shapeMarkup = node.shape === "ellipse"
    ? `<ellipse class="tree-node-shape" cx="${centerX}" cy="${node.height / 2}" rx="${node.width / 2}" ry="${node.height / 2}"></ellipse>`
    : `<rect class="tree-node-shape" x="0" y="0" width="${node.width}" height="${node.height}" rx="18" ry="18"></rect>`;

  return `
    <g
      class="${classes.join(" ")}"
      data-node-id="${id}"
      transform="translate(${node.left} ${node.top})"
    >
      ${shapeMarkup}
      ${textMarkup}
    </g>
  `;
}

function renderTreeBadge(x, y, width, height, label) {
  return `
    <g class="tree-badge" transform="translate(${x} ${y})">
      <rect width="${width}" height="${height}" rx="16" ry="16"></rect>
      <text x="${width / 2}" y="${height / 2}" text-anchor="middle" dominant-baseline="middle">${escapeHtml(label)}</text>
    </g>
  `;
}
