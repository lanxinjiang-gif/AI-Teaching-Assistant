  <circle cx="34" cy="30" r="1" fill="white"/>
  <circle cx="48" cy="30" r="1" fill="white"/>
  <!-- Focused brow -->
  <path d="M29 26 Q33 24 37 26" stroke="#7c2d12" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M43 26 Q47 24 51 26" stroke="#7c2d12" stroke-width="1.5" stroke-linecap="round" fill="none"/>
