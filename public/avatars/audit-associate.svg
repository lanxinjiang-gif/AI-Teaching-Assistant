<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 90" fill="none">

  <!-- Cape (behind body) — cream linen, handmade stitching -->
  <path d="M23 46 Q17 60 21 75 Q30 82 40 82 Q50 82 59 75 Q63 60 57 46 Q49 51 40 51 Q31 51 23 46Z" fill="#f5f0e6" stroke="#b8a87a" stroke-width="1"/>
  <!-- Cape stitching -->
  <path d="M26 54 Q40 59 54 54" stroke="#b8a87a" stroke-width="0.7" stroke-dasharray="2.5,2" fill="none"/>
  <!-- Cape clasp -->
  <circle cx="40" cy="47" r="2.5" fill="#a8c5a0" stroke="#6aab7a" stroke-width="0.8"/>

  <!-- Mini clipboard (right side, sticking out) -->
  <rect x="55" y="48" width="10" height="14" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.1"/>
  <rect x="57.5" y="46" width="5" height="3" rx="1.5" fill="#059669"/>
  <line x1="57" y1="54" x2="63" y2="54" stroke="#059669" stroke-width="0.8"/>
  <line x1="57" y1="57" x2="63" y2="57" stroke="#059669" stroke-width="0.8"/>
  <line x1="57" y1="60" x2="61" y2="60" stroke="#059669" stroke-width="0.8"/>

  <!-- Legs -->
  <rect x="30" y="62" width="9" height="10" rx="3" fill="#065f46"/>
  <rect x="41" y="62" width="9" height="10" rx="3" fill="#065f46"/>

  <!-- Boots (round-toed, cozy) -->
  <rect x="26" y="68" width="16" height="11" rx="5.5" fill="#3d1f08"/>
  <rect x="38" y="68" width="16" height="11" rx="5.5" fill="#3d1f08"/>
  <ellipse cx="31" cy="71" rx="4.5" ry="2.5" fill="#5c3010" opacity="0.55"/>
  <ellipse cx="43" cy="71" rx="4.5" ry="2.5" fill="#5c3010" opacity="0.55"/>

  <!-- Body — forest green blazer -->
  <rect x="25" y="42" width="30" height="23" rx="8" fill="#059669"/>
  <!-- Lapel panels -->
  <path d="M25 42 Q31 52 36 48 L36 42Z" fill="#047857"/>
  <path d="M55 42 Q49 52 44 48 L44 42Z" fill="#047857"/>
  <!-- White blouse front -->
  <rect x="36" y="42" width="8" height="14" rx="1" fill="#f8fafc"/>
  <!-- Small green scarf bow -->
  <polygon points="37,46 40,49.5 37,53" fill="#6ee7b7"/>
  <polygon points="43,46 40,49.5 43,53" fill="#6ee7b7"/>
  <circle cx="40" cy="49.5" r="2" fill="#10b981"/>
  <!-- Breast pocket -->
  <rect x="27" y="49" width="6" height="5" rx="2" fill="#047857" stroke="#6ee7b7" stroke-width="0.7"/>

  <!-- Head — big round chibi -->
  <circle cx="40" cy="24" r="19" fill="#fcd9bd"/>

  <!-- Ears -->
  <ellipse cx="21.5" cy="25" rx="3" ry="4" fill="#f5c4a5"/>
  <ellipse cx="58.5" cy="25" rx="3" ry="4" fill="#f5c4a5"/>

  <!-- Hair — auburn chestnut, soft mass with bun -->
  <ellipse cx="40" cy="10" rx="17" ry="10" fill="#92400e"/>
  <ellipse cx="23" cy="19" rx="5" ry="9" fill="#92400e"/>
  <ellipse cx="57" cy="19" rx="5" ry="9" fill="#92400e"/>
  <!-- Bun on top right -->
  <circle cx="51" cy="8" r="7.5" fill="#78350f"/>
  <circle cx="51" cy="8" r="5.5" fill="#92400e"/>
  <!-- Bun pin (golden) -->
  <line x1="51" y1="2.5" x2="51" y2="13.5" stroke="#d97706" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="51" cy="2.5" r="2" fill="#fbbf24"/>

  <!-- Rosy cheeks -->
  <ellipse cx="27" cy="30" rx="5.5" ry="3.5" fill="#fb7185" opacity="0.28"/>
  <ellipse cx="53" cy="30" rx="5.5" ry="3.5" fill="#fb7185" opacity="0.28"/>

  <!-- Eyes — big, warm, focused -->
  <circle cx="33" cy="24" r="5.5" fill="white"/>
  <circle cx="47" cy="24" r="5.5" fill="white"/>
  <circle cx="33" cy="24" r="3.5" fill="#1e293b"/>
  <circle cx="47" cy="24" r="3.5" fill="#1e293b"/>
  <!-- Iris tint -->
  <circle cx="33" cy="24" r="2" fill="#064e3b" opacity="0.55"/>
  <circle cx="47" cy="24" r="2" fill="#064e3b" opacity="0.55"/>
  <!-- Shine -->
  <circle cx="34.5" cy="22" r="1.6" fill="white"/>
  <circle cx="48.5" cy="22" r="1.6" fill="white"/>

  <!-- Focused brows (gently arched) -->
  <path d="M28 18 Q33 16 37 18" stroke="#7c2d12" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M43 18 Q47 16 52 18" stroke="#7c2d12" stroke-width="1.6" stroke-linecap="round" fill="none"/>

  <!-- Button nose -->
  <ellipse cx="40" cy="30.5" rx="2" ry="1.5" fill="#b45309" opacity="0.45"/>

  <!-- Warm smile -->
  <path d="M34 37 Q40 43 46 37" stroke="#92400e" stroke-width="2" stroke-linecap="round" fill="none"/>

</svg>
