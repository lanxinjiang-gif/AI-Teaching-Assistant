  <!-- Collar -->
  <polygon points="36,44 44,44 41,56 39,56" fill="#d1fae5"/>
  <!-- Head -->
  <circle cx="40" cy="32" r="18" fill="#fcd9bd"/>
  <!-- Hair -->
  <ellipse cx="40" cy="16" rx="16" ry="7" fill="#92400e"/>
