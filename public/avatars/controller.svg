<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 90" width="80" height="90" fill="none">

  <!-- === CAPE (rendered first, behind everything) === -->
  <path d="M22 46 Q15 60 20 75 Q29 82 40 82 Q51 82 60 75 Q65 60 58 46 Q50 51 40 51 Q31 51 22 46Z" fill="#1e2a3a" stroke="#334155" stroke-width="1"/>
  <path d="M26 54 Q40 59 54 54" stroke="#475569" stroke-width="0.7" stroke-dasharray="2.5,2" fill="none"/>
  <!-- Gold clasp -->
  <circle cx="40" cy="47.5" r="2.5" fill="#f0c040" stroke="#b8902a" stroke-width="0.8"/>

  <!-- === LEGS === -->
  <rect x="30" y="62" width="9" height="10" rx="3" fill="#1e1b4b"/>
  <rect x="41" y="62" width="9" height="10" rx="3" fill="#1e1b4b"/>

  <!-- === BOOTS — polished near-black === -->
  <rect x="26" y="68" width="16" height="11" rx="5.5" fill="#1a1a2e"/>
  <rect x="38" y="68" width="16" height="11" rx="5.5" fill="#1a1a2e"/>
  <ellipse cx="31" cy="71" rx="5" ry="2.5" fill="#2e2e50" opacity="0.9"/>
  <ellipse cx="43" cy="71" rx="5" ry="2.5" fill="#2e2e50" opacity="0.9"/>

  <!-- === BODY — Deep navy double-breasted suit === -->
  <rect x="25" y="43" width="30" height="22" rx="7" fill="#1e1b4b" stroke="#312e81" stroke-width="1.2"/>
  <!-- Lapels -->
  <path d="M25 43 Q31 54 37 50 L37 43Z" fill="#312e81"/>
  <path d="M55 43 Q49 54 43 50 L43 43Z" fill="#312e81"/>
  <!-- White shirt -->
  <rect x="37" y="43" width="6" height="13" rx="1" fill="#f8fafc"/>
  <!-- Purple tie -->
  <polygon points="38.5,45 41.5,45 42,56 40,58 38,56" fill="#7c3aed"/>
  <polygon points="38.5,45 41.5,45 40,48" fill="#6d28d9"/>
  <!-- Double-breasted buttons -->
  <circle cx="29" cy="51" r="1.5" fill="#4338ca"/>
  <circle cx="29" cy="56" r="1.5" fill="#4338ca"/>
  <circle cx="51" cy="51" r="1.5" fill="#4338ca"/>
  <circle cx="51" cy="56" r="1.5" fill="#4338ca"/>
  <!-- Pocket square -->
  <path d="M27 47 Q30.5 44.5 33 47" fill="none" stroke="#c7d2fe" stroke-width="1.2" stroke-linecap="round"/>

  <!-- === HAIR BEHIND HEAD (drawn before face) === -->
  <ellipse cx="40" cy="21" rx="22" ry="21" fill="#c8d0dc" stroke="#4a3728" stroke-width="1.5"/>
  <!-- Hair highlight blob -->
  <ellipse cx="33" cy="12" rx="8" ry="5" fill="white" opacity="0.28" transform="rotate(-20,33,12)"/>

  <!-- === HEAD/FACE === -->
  <ellipse cx="40" cy="26" rx="19" ry="18" fill="#fcebd8" stroke="#4a3728" stroke-width="1.8"/>

  <!-- Ears -->
  <ellipse cx="21.5" cy="27" rx="3" ry="4" fill="#fcebd8" stroke="#4a3728" stroke-width="1.2"/>
  <ellipse cx="58.5" cy="27" rx="3" ry="4" fill="#fcebd8" stroke="#4a3728" stroke-width="1.2"/>
  <ellipse cx="21.5" cy="27" rx="1.8" ry="2.5" fill="#f5b8a0" opacity="0.6"/>
  <ellipse cx="58.5" cy="27" rx="1.8" ry="2.5" fill="#f5b8a0" opacity="0.6"/>

  <!-- === BANGS — silver/white, neat short with clean side part === -->
  <path d="M22 24 Q24 13 31 11 Q36 7 40 7 Q44 7 49 11 Q56 13 58 24 Q54 17 48 18 Q45 11 40 11 Q35 11 32 18 Q26 17 22 24Z" fill="#c8d0dc" stroke="#4a3728" stroke-width="1"/>
  <!-- Side part line -->
  <path d="M38 8 Q40 6 42 8" stroke="#e2e8f0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- === CHEEK BLUSH — subtle, distinguished === -->
  <ellipse cx="27" cy="33" rx="6" ry="3.5" fill="#f9a8d4" opacity="0.22"/>
  <ellipse cx="53" cy="33" rx="6" ry="3.5" fill="#f9a8d4" opacity="0.22"/>

  <!-- === STRONG CLEAN BROWS === -->
  <path d="M23 18 L37 17" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M43 17 L57 18" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>

  <!-- === EYES — anime chibi style, slightly composed/half-lidded (LEFT) === -->
  <!-- Eye white -->
  <ellipse cx="31" cy="27" rx="7.5" ry="9" fill="white" stroke="#4a3728" stroke-width="0.5"/>
  <!-- Top lash — THICK, slightly more composed (flatter curve = more lidded look) -->
  <path d="M23 20 Q31 16 39 20" stroke="#4a3728" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <!-- Half-lid overlay — adds composed feel -->
  <path d="M23 20 Q31 22 39 20 L39 24 Q31 25 23 24Z" fill="#fcebd8" opacity="0.55"/>
  <!-- Iris — deep navy -->
  <ellipse cx="31" cy="29" rx="6" ry="7" fill="#3a5f8a"/>
  <!-- Iris lighter top zone -->
  <ellipse cx="31" cy="25" rx="5" ry="3.8" fill="white" opacity="0.3"/>
  <!-- Pupil -->
  <ellipse cx="31" cy="30" rx="3.2" ry="4.2" fill="#1a2540"/>
  <!-- Large white highlight upper-left -->
  <ellipse cx="27.5" cy="23.5" rx="3" ry="3.2" fill="white"/>
  <!-- Small white highlight lower-right -->
  <circle cx="36" cy="33.5" r="1.5" fill="white" opacity="0.85"/>
  <!-- Bottom lash line (thin) -->
  <path d="M23.5 36 Q31 38.5 38.5 36" stroke="#4a3728" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- === EYES — anime chibi style, slightly composed/half-lidded (RIGHT) === -->
  <ellipse cx="49" cy="27" rx="7.5" ry="9" fill="white" stroke="#4a3728" stroke-width="0.5"/>
  <path d="M41 20 Q49 16 57 20" stroke="#4a3728" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <!-- Half-lid overlay -->
  <path d="M41 20 Q49 22 57 20 L57 24 Q49 25 41 24Z" fill="#fcebd8" opacity="0.55"/>
  <ellipse cx="49" cy="29" rx="6" ry="7" fill="#3a5f8a"/>
  <ellipse cx="49" cy="25" rx="5" ry="3.8" fill="white" opacity="0.3"/>
  <ellipse cx="49" cy="30" rx="3.2" ry="4.2" fill="#1a2540"/>
  <ellipse cx="45.5" cy="23.5" rx="3" ry="3.2" fill="white"/>
  <circle cx="54" cy="33.5" r="1.5" fill="white" opacity="0.85"/>
  <path d="M41.5 36 Q49 38.5 56.5 36" stroke="#4a3728" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- === NOSE — tiny two dots === -->
  <circle cx="38.5" cy="36" r="1.2" fill="#c97b5a" opacity="0.6"/>
  <circle cx="41.5" cy="36" r="1.2" fill="#c97b5a" opacity="0.6"/>

  <!-- === MOUTH — confident small half-smile === -->
  <path d="M35 40 Q40 43 45 40" stroke="#c97b5a" stroke-width="1.8" stroke-linecap="round" fill="none"/>

</svg>
