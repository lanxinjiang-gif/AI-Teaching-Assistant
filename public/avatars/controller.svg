<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Body / suit -->
  <rect x="20" y="44" width="40" height="28" rx="8" fill="#1e1b4b"/>
  <!-- Lapels -->
  <polygon points="36,44 40,52 34,60 20,60 20,44" fill="#312e81"/>
  <polygon points="44,44 40,52 46,60 60,60 60,44" fill="#312e81"/>
  <!-- Shirt / tie -->
  <rect x="37" y="44" width="6" height="14" fill="#f8fafc"/>
  <polygon points="38,46 42,46 41,58 39,58" fill="#7c3aed"/>
  <!-- Head -->
  <circle cx="40" cy="32" r="18" fill="#fde68a"/>
  <!-- Silver hair -->
  <ellipse cx="40" cy="16" rx="16" ry="7" fill="#cbd5e1"/>
  <rect x="24" y="18" width="5" height="7" rx="2" fill="#cbd5e1"/>
  <rect x="51" y="18" width="5" height="7" rx="2" fill="#cbd5e1"/>
  <!-- Authoritative eyes -->
  <ellipse cx="33" cy="31" rx="3" ry="2.5" fill="#1e293b"/>
  <ellipse cx="47" cy="31" rx="3" ry="2.5" fill="#1e293b"/>
  <circle cx="34" cy="30" r="1" fill="white"/>
  <circle cx="48" cy="30" r="1" fill="white"/>
  <!-- Strong brow -->
  <path d="M29 26 L37 25" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M43 25 L51 26" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <!-- Confident half-smile -->
  <path d="M34 39 Q40 43 46 39" stroke="#92400e" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Subtle wrinkle lines for seniority -->
  <path d="M27 29 Q28 32 27 35" stroke="#d97706" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M53 29 Q52 32 53 35" stroke="#d97706" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.4"/>
</svg>
