<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 90" width="80" height="90" fill="none">

  <!-- Cape (drawn behind body) — cream linen, handmade hem -->
  <path d="M23 46 Q17 60 21 75 Q30 82 40 82 Q50 82 59 75 Q63 60 57 46 Q49 51 40 51 Q31 51 23 46Z" fill="#f0e8d4" stroke="#bfa882" stroke-width="1"/>
  <!-- Cape stitching detail -->
  <path d="M26 54 Q40 59 54 54" stroke="#bfa882" stroke-width="0.7" stroke-dasharray="2.5,2" fill="none"/>
  <!-- Cape clasp -->
  <circle cx="40" cy="47" r="2.5" fill="#c8a96e" stroke="#a07840" stroke-width="0.8"/>

  <!-- Legs -->
  <rect x="30" y="62" width="9" height="10" rx="3" fill="#3730a3"/>
  <rect x="41" y="62" width="9" height="10" rx="3" fill="#3730a3"/>

  <!-- Boots (round-toed, cozy) -->
  <rect x="26" y="68" width="16" height="11" rx="5.5" fill="#2c1806"/>
  <rect x="38" y="68" width="16" height="11" rx="5.5" fill="#2c1806"/>
  <!-- Boot toe highlight -->
  <ellipse cx="31" cy="71" rx="4.5" ry="2.5" fill="#4a2e0a" opacity="0.55"/>
  <ellipse cx="43" cy="71" rx="4.5" ry="2.5" fill="#4a2e0a" opacity="0.55"/>

  <!-- Body — indigo vest -->
  <rect x="25" y="42" width="30" height="23" rx="8" fill="#4f46e5"/>
  <!-- Lapel panels -->
  <path d="M25 42 Q31 52 36 48 L36 42Z" fill="#3730a3"/>
  <path d="M55 42 Q49 52 44 48 L44 42Z" fill="#3730a3"/>
  <!-- White shirt front -->
  <rect x="36" y="42" width="8" height="14" rx="1" fill="#f8fafc"/>
  <!-- Bow tie -->
  <polygon points="37,46 40,49.5 37,53" fill="#818cf8"/>
  <polygon points="43,46 40,49.5 43,53" fill="#818cf8"/>
  <circle cx="40" cy="49.5" r="2" fill="#6366f1"/>
  <!-- Small breast pocket + handkerchief -->
  <rect x="27" y="49" width="6" height="5" rx="2" fill="#3730a3" stroke="#6366f1" stroke-width="0.7"/>
  <path d="M29 49 Q30.5 47 32 49" fill="#c7d2fe"/>

  <!-- Head — big round chibi -->
  <circle cx="40" cy="24" r="19" fill="#fde68a"/>

  <!-- Ears -->
  <ellipse cx="21.5" cy="25" rx="3" ry="4" fill="#fcd34d"/>
  <ellipse cx="58.5" cy="25" rx="3" ry="4" fill="#fcd34d"/>

  <!-- Hair — dark navy, soft tufts on top -->
  <ellipse cx="40" cy="10" rx="17" ry="10" fill="#1e1b4b"/>
  <ellipse cx="23" cy="19" rx="5" ry="9" fill="#1e1b4b"/>
  <ellipse cx="57" cy="19" rx="5" ry="9" fill="#1e1b4b"/>
  <ellipse cx="36" cy="7" rx="4.5" ry="6" fill="#1e1b4b" transform="rotate(-15,36,7)"/>
  <ellipse cx="44" cy="6" rx="4" ry="5.5" fill="#1e1b4b" transform="rotate(15,44,6)"/>

  <!-- Rosy cheeks -->
  <ellipse cx="27" cy="30" rx="5.5" ry="3.5" fill="#fb7185" opacity="0.28"/>
  <ellipse cx="53" cy="30" rx="5.5" ry="3.5" fill="#fb7185" opacity="0.28"/>

  <!-- Eyes — large, round, gentle -->
  <circle cx="33" cy="24" r="5.5" fill="white"/>
  <circle cx="47" cy="24" r="5.5" fill="white"/>
  <circle cx="33" cy="24" r="3.5" fill="#1e1b4b"/>
  <circle cx="47" cy="24" r="3.5" fill="#1e1b4b"/>
  <!-- Iris tint -->
  <circle cx="33" cy="24" r="2" fill="#3730a3" opacity="0.6"/>
  <circle cx="47" cy="24" r="2" fill="#3730a3" opacity="0.6"/>
  <!-- Shine -->
  <circle cx="34.5" cy="22" r="1.6" fill="white"/>
  <circle cx="48.5" cy="22" r="1.6" fill="white"/>

  <!-- Round wire glasses (indigo) -->
  <circle cx="33" cy="24" r="7" stroke="#6366f1" stroke-width="1.5" fill="none"/>
  <circle cx="47" cy="24" r="7" stroke="#6366f1" stroke-width="1.5" fill="none"/>
  <path d="M39.5 24 Q40 23 40.5 24" stroke="#6366f1" stroke-width="1.5" fill="none"/>
  <line x1="26" y1="21.5" x2="22" y2="20" stroke="#6366f1" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="54" y1="21.5" x2="58" y2="20" stroke="#6366f1" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Button nose -->
  <ellipse cx="40" cy="30.5" rx="2" ry="1.5" fill="#d97706" opacity="0.45"/>

  <!-- Gentle smile -->
  <path d="M34 37 Q40 43 46 37" stroke="#b45309" stroke-width="2" stroke-linecap="round" fill="none"/>

</svg>
